async function dcLoad(){
  const out=document.getElementById('dc_out'); if(!out) return;
  const f=document.getElementById('dc_f').value, t=document.getElementById('dc_t').value;
  if(!f||!t){ toast('Select both dates','error'); return; }
  if(f>t){ toast('"From" date must not be after "To" date','error'); return; }
  out.innerHTML='Loading…';
  try{
    await oeLoadVehicles();
    const lo=new Date(f+'T00:00:00').toISOString(), hi=new Date(t+'T23:59:59.999').toISOString();
    let all=[], from=0;
    for(;;){
      const { data, error } = await oilDb.from('diesel_data').select('code,vehicle_name,entry_datetime,quantity')
        .gte('entry_datetime',lo).lte('entry_datetime',hi).order('entry_datetime',{ascending:true}).order('id',{ascending:true}).range(from,from+999);
      if(error) throw error;
      all=all.concat(data||[]); if(!data||data.length<1000) break; from+=1000;
    }
    const days=[]; for(let d=new Date(f+'T00:00:00'); dcYmd(d)<=t; d.setDate(d.getDate()+1)) days.push(dcYmd(d));
    const map=new Map(); oeVehicles.forEach(v=>map.set(v.vehicle_name,{name:v.vehicle_name,code:v.code,byDay:{},total:0}));
    const dayTotals={}; let grand=0;
    all.forEach(r=>{
      const name=String(r.vehicle_name||'').trim()||String(r.code||'Unknown'), q=+r.quantity||0, day=dcYmd(new Date(r.entry_datetime));
      if(!map.has(name)) map.set(name,{name,code:String(r.code||''),byDay:{},total:0});
      const row=map.get(name); row.byDay[day]=(row.byDay[day]||0)+q; row.total+=q; dayTotals[day]=(dayTotals[day]||0)+q; grand+=q;
    });
    dcAgg={days,rows:[...map.values()],dayTotals,grand,vehTotal:oeVehicles.length};
    dcRender();
  }catch(e){ out.innerHTML=`<div class="text-red-600">Could not load diesel data: ${escapeHtml(e.message||e)}</div>`; }
}
function dcRender(){
  if(!dcAgg) return;
  const {days,rows,dayTotals,grand,vehTotal}=dcAgg;
  const s=fqNorm(document.getElementById('dc_s').value), sb=document.getElementById('dc_sb').value, so=document.getElementById('dc_so').value;
  dcView=rows.filter(r=>!s||fqNorm(r.name).includes(s)||fqNorm(r.code).includes(s));
  const dir=so==='desc'?-1:1;
  dcView.sort((a,b)=>dir*(sb==='total'?(a.total-b.total||a.name.localeCompare(b.name,undefined,{numeric:true})):a.name.localeCompare(b.name,undefined,{numeric:true})));
  /* stats (whole date range, independent of search) */
  const withEntries=rows.filter(r=>r.total>0).length;
  const topV=rows.reduce((a,r)=>r.total>(a?a.total:0)?r:a,null);
  const topD=Object.entries(dayTotals).reduce((a,e)=>e[1]>(a?a[1]:0)?e:a,null);
  const card=(l,v,sub)=>`<div class="rounded-xl border border-cyan-100 bg-cyan-50 p-4"><div class="text-[11px] font-semibold uppercase tracking-wide text-slate-500">${l}</div><div class="text-xl font-bold text-navy-900 mt-1 break-words">${v}</div>${sub?`<div class="text-xs text-slate-500 mt-1">${sub}</div>`:''}</div>`;
  document.getElementById('dc_stats').innerHTML=
    card('Total diesel consumption',dcNum(grand)+' LTR')+
    card('Vehicles with diesel entries',withEntries,`of ${vehTotal} vehicles`)+
    card('Average daily consumption',dcNum(days.length?grand/days.length:0)+' LTR',`over ${days.length} day${days.length===1?'':'s'}`)+
    card('Highest-consumption vehicle',topV?escapeHtml(topV.name):'—',topV?dcNum(topV.total)+' LTR':'')+
    card('Highest-consumption date',topD?dcDayFull(topD[0]):'—',topD?dcNum(topD[1])+' LTR':'');
  /* heat scale: highest single cell among rows shown */
  let max=0; dcView.forEach(r=>days.forEach(d=>{ if((r.byDay[d]||0)>max) max=r.byDay[d]; }));
  const out=document.getElementById('dc_out');
  if(!dcView.length){ out.innerHTML='<div class="py-6 text-center text-slate-400">No vehicles match.</div>'; return; }
  const shownDay={}; let shownTot=0; dcView.forEach(r=>{ days.forEach(d=>{ shownDay[d]=(shownDay[d]||0)+(r.byDay[d]||0); }); shownTot+=r.total; });
  document.getElementById('dc_leg').innerHTML=`<span style="display:inline-block;width:14px;height:14px;border:1px solid #94a3b8;border-radius:3px;background:#fff"></span><span>0</span><span>Low</span><span style="width:190px;height:12px;border-radius:6px;background:linear-gradient(90deg,hsl(120,70%,78%),hsl(60,76%,72%),hsl(30,80%,66%),hsl(0,85%,58%))"></span><span>Very high (${dcNum(max)} LTR)</span><span class="font-normal text-slate-500">(green &rarr; yellow &rarr; orange &rarr; red, scaled to the highest cell shown)</span>`;
  out.innerHTML=`<div class="dc-wrap"><table class="dc-table"><thead><tr><th class="dc-n">Vehicle Name</th>${days.map(d=>`<th>${dcDayLbl(d)}</th>`).join('')}<th class="dc-t">Total (LTR)</th></tr></thead><tbody>
    ${dcView.map(r=>`<tr><td class="dc-n">${escapeHtml(r.name)}</td>${days.map(d=>{ const q=r.byDay[d]; return q>0?`<td class="dc-h" style="background:${dcHeat(q,max)}">${dcNum(q)}</td>`:'<td class="dc-e">–</td>'; }).join('')}<td class="dc-t">${dcNum(r.total)}</td></tr>`).join('')}
    </tbody><tfoot><tr><td class="dc-n">Total Daily Consumption (LTR)</td>${days.map(d=>`<td>${dcNum(shownDay[d]||0)}</td>`).join('')}<td class="dc-t">${dcNum(shownTot)}</td></tr></tfoot></table></div>`;
}
/* export helpers — same data as shown on screen (static table with heat colours) */
function dcStaticTable(){
  const {days}=dcAgg; let max=0; dcView.forEach(r=>days.forEach(d=>{ if((r.byDay[d]||0)>max) max=r.byDay[d]; }));
  const th='style="border:1px solid #cbd5e1;padding:4px 6px;background:#f1f5f9;font-weight:bold"', td='border:1px solid #cbd5e1;padding:4px 6px;text-align:center;';
  return `<table style="border-collapse:collapse;font-family:Arial;font-size:11px"><thead><tr><th ${th}>Vehicle Name</th>${days.map(d=>`<th ${th}>${dcDayLbl(d)}</th>`).join('')}<th ${th}>Total (LTR)</th></tr></thead><tbody>
   ${dcView.map(r=>`<tr><td style="${td}text-align:left;font-weight:bold">${escapeHtml(r.name)}</td>${days.map(d=>{ const q=r.byDay[d]; return q>0?`<td style="${td}background:${dcHeat(q,max)}">${Number(q.toFixed(2))}</td>`:`<td style="${td}color:#94a3b8">–</td>`; }).join('')}<td style="${td}font-weight:bold;background:#f1f5f9">${Number(r.total.toFixed(2))}</td></tr>`).join('')}</tbody><tfoot><tr><td style="${td}text-align:left;font-weight:bold;background:#e8eef5">Total Daily Consumption (LTR)</td>${days.map(d=>`<td style="${td}font-weight:bold;background:#e8eef5">${Number(dcView.reduce((a,r)=>a+(r.byDay[d]||0),0).toFixed(2))}</td>`).join('')}<td style="${td}font-weight:bold;background:#e8eef5">${Number(dcView.reduce((a,r)=>a+r.total,0).toFixed(2))}</td></tr></tfoot></table>`;
}
function dcTitle(){ return `Diesel Consumption ${document.getElementById('dc_f').value} to ${document.getElementById('dc_t').value}`; }
function dcExcel(){
  if(!dcAgg||!dcView.length){ toast('Nothing to export','error'); return; }
  const html=`<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body><h3>${escapeHtml(dcTitle())}</h3>${dcStaticTable()}</body></html>`;
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel'}));
  a.download=dcTitle().replace(/\s+/g,'_')+'.xls'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);

/* ============================================================
   UNIVERSAL REPLACEMENT HISTORY  (table: item_replacement_history)
   Filter / Oil / Other entry pages all write here; snapshots
   last_filter_consumption / last_oil_consumption are kept in sync by DB triggers.
   ============================================================ */
const RH_TABLE = 'item_replacement_history';
const rhUuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);}));
const rhClean = s => String(s||'').trim().replace(/[,()%*]/g,'');
async function rhLoadItems(cat){
  const { data, error } = await db.from('items').select('id,item_name,item_code,item_category,unit,status').ilike('item_category', cat).order('item_name');
  if (error) throw error;
  return (data||[]).filter(i=>i.status!=='Inactive');
}
/* rows share one entry_group_id; a retry with the same group id cannot duplicate (unique index) */
async function rhInsert(rows){
  const { error } = await db.from(RH_TABLE).insert(rows);
  if (error && error.code!=='23505') return error;   // 23505 = this group was already saved
  return null;
}
const rhBase = (v,it,date,qty,meter,rem,extra) => ({
  vehicle_name:v.vehicle_name, vehicle_code:v.code, item_id:it.id, item_name:it.item_name, item_code:it.item_code,
  item_category:it.item_category, replacement_date:date, quantity:qty, uom:it.unit||null,
  meter_reading:meter, remarks:rem||null, extra_data:extra||{}, created_by:(currentUser&&String(currentUser.id))||null });

function otShowVeh(){

let otFound=[];

/* ---- QR scanning for Other Item Replacement vehicle selection ---- */
let otScanner=null, otScanBusy=false;
function otSelectByCode(raw){
  const code=String(raw||'').trim().toUpperCase();
  const v=fqVehicles.find(x=>String(x.code).toUpperCase()===code);
  if(!v){ toast(`No registered vehicle for "${code}"`,'error'); return false; }
  otVeh=v; const q=document.getElementById('ot_vq'); if(q) q.value='';
  const r=document.getElementById('ot_vres'); if(r) r.classList.add('hidden');
  otShowVeh(); toast('Vehicle selected: '+v.vehicle_name,'success');
  return true;
}
async function otStopScan(){
  const sc=otScanner; otScanner=null; if(!sc) return;
  try{ if(sc.isScanning) await sc.stop(); }catch(e){}
  try{ sc.clear(); }catch(e){}
}
function otOpenScanner(){
  if(typeof Html5Qrcode==='undefined'){ toast('QR scanner could not load. Check your internet connection.','error'); return; }
  openModal('Scan vehicle QR code', `
    <div id="ot_reader" class="w-full rounded-xl overflow-hidden bg-slate-900 min-h-[260px]"></div>
    <p id="ot_scanMsg" class="text-sm text-slate-500 mt-3 text-center">Point the camera at the vehicle's QR code.</p>
    <div class="text-center mt-3">
      <label class="inline-flex items-center gap-2 text-sm text-teal-700 cursor-pointer hover:underline">
        <i data-lucide="image" class="w-4 h-4"></i> Upload a QR image instead
        <input type="file" id="ot_qrfile" accept="image/*" class="hidden"/></label>
    </div>`,
    `<button onclick="closeModal()" class="px-3 py-1.5 text-sm border border-slate-300 rounded-lg">Cancel</button>`);
  const msg=t=>{ const m=document.getElementById('ot_scanMsg'); if(m) m.textContent=t; };
  const sc=new Html5Qrcode('ot_reader'); otScanner=sc; otScanBusy=false;
  const onHit=async text=>{
    if(otScanBusy) return; otScanBusy=true;
    if(otSelectByCode(text)){ await otStopScan(); closeModal(); }
    else setTimeout(()=>{ otScanBusy=false; },1500);
  };
  sc.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:230}},onHit,()=>{})
    .catch(err=>{
      const txt=String(err||'');
      msg(/Permission|NotAllowed/i.test(txt)?'Camera access was blocked. Allow the camera in your browser, or upload a QR image.'
        :window.isSecureContext?'Could not start the camera. You can upload a QR image instead.'
        :'The camera needs a secure (https) page. You can upload a QR image instead.');
    });
  document.getElementById('ot_qrfile').addEventListener('change',async e=>{
    const file=e.target.files[0]; if(!file) return;
    try{
      if(sc.isScanning) await sc.stop();
      const text=await sc.scanFile(file,false);
      if(otSelectByCode(text)){ await otStopScan(); closeModal(); }
    }catch(err){ msg('No QR code found in that image. Try another one.'); }
    e.target.value='';
  });
  lucide.createIcons();
}
async function otSearchItems(){
  const q=rhClean(document.getElementById('ot_iq').value), box=document.getElementById('ot_ires'); if(!box) return;
  if(q.length<2){ box.classList.add('hidden'); return; }
  const { data, error } = await db.from('items').select('id,item_name,item_code,item_category,unit,status')
    .or(`item_name.ilike.%${q}%,item_code.ilike.%${q}%,item_category.ilike.%${q}%`).order('item_name').limit(40);
  box.classList.remove('hidden');
  if(error){ box.innerHTML=`<div class="p-4 text-sm text-red-600">${escapeHtml(error.message)}</div>`; return; }
  otFound=(data||[]).filter(i=>i.status!=='Inactive' && !/^(filter|oil)$/i.test((i.item_category||'').trim())).slice(0,20);
  box.innerHTML=otFound.length?otFound.map((i,k)=>`<button type="button" data-i="${k}" class="block w-full px-4 py-2.5 text-left border-b border-slate-200 bg-white hover:bg-teal-50"><div class="text-sm font-medium">${escapeHtml(i.item_name)}</div><div class="text-xs text-slate-500"><span class="font-mono">${escapeHtml(i.item_code||'')}</span> · ${escapeHtml(i.item_category||'—')} · ${escapeHtml(i.unit||'')}</div></button>`).join(''):'<div class="p-4 text-sm text-slate-500">No matching items (Filter/Oil items use their own pages)</div>';
}
function otAdd(it){
  if(!it) return;
  if(otRows.some(r=>r.it.id===it.id)){ toast('Item already added.','error'); return; }
  otRows.push({it, qty:1});
  const q=document.getElementById('ot_iq'); q.value=''; document.getElementById('ot_ires').classList.add('hidden'); otRender();
}
function otRender(){
  const h=document.getElementById('ot_list'); if(!h) return;
  h.innerHTML=otRows.length?`<table class="data w-full text-sm"><thead><tr><th class="text-left px-2 py-2">Item</th><th class="text-left px-2 py-2">Code</th><th class="text-left px-2 py-2 w-28">Qty</th><th class="text-left px-2 py-2 w-20">UoM</th><th class="text-left px-2 py-2 w-20">Action</th></tr></thead><tbody>
   ${otRows.map((r,i)=>`<tr><td class="px-2 py-2">${escapeHtml(r.it.item_name)}<div class="text-[11px] text-slate-400">${escapeHtml(r.it.item_category||'')}</div></td><td class="px-2 py-2 font-mono text-xs">${escapeHtml(r.it.item_code||'')}</td>
   <td class="px-2 py-2 align-middle"><input type="number" data-q="${i}" min="0.01" step="any" value="${r.qty}" class="w-24 border border-slate-300 rounded-lg px-2 py-1.5 text-sm"/></td><td class="px-2 py-2 align-middle">${escapeHtml(r.it.unit||'')}</td>
   <td class="px-2 py-2"><button type="button" data-rm="${i}" class="text-red-600 text-xs">Remove</button></td></tr>`).join('')}</tbody></table>`
   :'<div class="text-sm text-slate-400">No items added yet.</div>';
}
async function otSave(){
  if(otBusy) return;
  const er=document.getElementById('ot_err'); er.textContent=''; const fail=m=>{ er.textContent=m; };
  const date=document.getElementById('ot_date').value, mr=document.getElementById('ot_meter').value.trim(), m=mr===''?null:parseFloat(mr);
  if(!otVeh) return fail('Select a vehicle.');
  if(!date) return fail('Select the replacement date.');
  if(!otRows.length) return fail('Add at least one item.');
  if(otRows.some(r=>!(r.qty>0))) return fail('Quantity must be greater than zero for every item.');
  if(m!==null && (isNaN(m)||m<0)) return fail('Enter a valid meter reading.');
  otBusy=true; const b=document.getElementById('ot_save'); b.disabled=true; b.textContent='Saving…';
  const rm=document.getElementById('ot_rem').value.trim();
  const rows=otRows.map(r=>({...rhBase(otVeh,r.it,date,r.qty,m,rm,{source:'other_entry'}), entry_group_id:otGid}));
  const error=await rhInsert(rows);
  otBusy=false; b.disabled=false; b.innerHTML='&#10003; Submit Replacement';
  if(error){ fail('Not saved: '+error.message); toast('Not saved','error'); return; }
  try{ await logActivity('OTHER_REPLACEMENT_CREATE',RH_TABLE,null,`${otVeh.vehicle_name} (${otVeh.code})`); }catch(e){}
  toast('Replacement saved for '+otVeh.vehicle_name,'success');
  otVeh=null; otRows=[]; otGid=rhUuid(); otShowVeh(); otRender();
  document.getElementById('ot_meter').value='0'; document.getElementById('ot_rem').value=''; document.getElementById('ot_date').value=deToday();
}

/* ---------------- History pages (Filter / Oil / Other) ---------------- */
const RH_PAGE = 15; let rhS = {kind:'Filter', page:0, total:0, rows:[], readOnly:false};
function rhQuery(q){
  const k=rhS.kind, g=id=>(document.getElementById(id)||{}).value||'';
  q = q.eq('entry_type', k);
  const s=rhClean(g('rh_s')); if(s) q=q.or(`vehicle_name.ilike.%${s}%,vehicle_code.ilike.%${s}%`);
  const i=rhClean(g('rh_i')); if(i) q=q.or(`item_name.ilike.%${i}%,item_code.ilike.%${i}%`);
  const c=rhClean(g('rh_c')); if(c) q=q.ilike('item_category',`%${c}%`);
  if(k==='Oil' && g('rh_p')) q=q.eq('extra_data->>purpose', g('rh_p'));
  if(g('rh_f')) q=q.gte('replacement_date',g('rh_f'));
  if(g('rh_t')) q=q.lte('replacement_date',g('rh_t'));
  return q;
}
const rhOrder = q => q.order('replacement_date',{ascending:false}).order('created_at',{ascending:false}).order('id',{ascending:false});
function rhRoute(host, kind, readOnly=false){
  rhS = {kind, page:0, total:0, rows:[], readOnly};
  const inp='w-full border border-slate-300 rounded-lg px-3 py-2 text-sm', L=(t,h)=>`<div><label class="block mb-1 text-xs font-medium">${t}</label>${h}</div>`;
  host.innerHTML=`<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
   <h3 class="font-semibold text-navy-900 mb-3">${readOnly ? (kind==='Other'?'Spare change':kind+' change')+' data' : (kind==='Other'?'Other item replacement':kind+' change')+' history'}</h3>
   <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-6 gap-3 mb-4 items-end">
     ${L('Vehicle',`<input id="rh_s" placeholder="Vehicle name or code" class="${inp}"/>`)}

     ${kind==='Oil'?L('Purpose',`<select id="rh_p" class="${inp}"><option value="">All purposes</option>${OE_PURPOSES.map(p=>`<option>${escapeHtml(p)}</option>`).join('')}</select>`):''}
     ${L('From',`<input type="date" id="rh_f" class="${inp}"/>`)}${L('To',`<input type="date" id="rh_t" class="${inp}"/>`)}
   </div>
   <div class="flex justify-end gap-2 mb-3"><button id="rh_x" class="border border-slate-300 hover:bg-slate-50 rounded-lg px-3 py-2 text-sm font-medium">Export Excel</button><button id="rh_r" class="border border-slate-300 hover:bg-slate-50 rounded-lg px-3 py-2 text-sm font-medium">Refresh</button></div>
   <div id="rh_out" class="text-slate-400 text-sm">Loading…</div>
   <div class="flex items-center justify-between mt-3 gap-2"><button id="rh_pv" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm disabled:opacity-50">Previous</button><span id="rh_pi" class="text-sm text-slate-500"></span><button id="rh_n" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm disabled:opacity-50">Next</button></div></div>`;
  ['rh_s','rh_i','rh_c','rh_p','rh_f','rh_t'].forEach(id=>{ const e=document.getElementById(id); if(e) e.addEventListener('input',()=>{ rhS.page=0; clearTimeout(window._rhT); window._rhT=setTimeout(rhLoad,250); }); });
  document.getElementById('rh_r').onclick=rhLoad; document.getElementById('rh_x').onclick=rhExport;
  document.getElementById('rh_pv').onclick=()=>{ rhS.page--; rhLoad(); }; document.getElementById('rh_n').onclick=()=>{ rhS.page++; rhLoad(); };
  document.getElementById('rh_out').addEventListener('click',e=>{ const b=e.target.closest('button[data-act]'); if(b && !rhS.readOnly){ e.stopPropagation(); const r=rhS.rows[b.dataset.i]; return b.dataset.act==='edit'?rhEdit(r):rhDelete(r); } const tr=e.target.closest('[data-i]'); if(tr) rhDetail(rhS.rows[tr.dataset.i]); });
  return rhLoad();
}
const rhCols = k => [['Date','replacement_date'],['Vehicle','vehicle_name'],[k==='Oil'?'Oil Item':'Item','item_name'],...(k==='Other'?[['Category','item_category']]:[]),['Item Code','item_code'],['Quantity','quantity'],['UoM','uom'],['Meter Reading','meter_reading'],['Remarks','remarks']];
async function rhLoad(){
  const out=document.getElementById('rh_out'); if(!out) return;
  const { data, count, error } = await rhOrder(rhQuery(db.from(RH_TABLE).select('*',{count:'exact'}))).range(rhS.page*RH_PAGE, rhS.page*RH_PAGE+RH_PAGE-1);
  if(error){ out.innerHTML=`<div class="text-red-600">Could not load records: ${escapeHtml(error.message)}</div>`; return; }
  rhS.total=count||0; rhS.rows=data; const cols=rhCols(rhS.kind);
  out.innerHTML=data.length?`<div class="overflow-x-auto"><table class="data w-full text-sm"><thead><tr>${cols.map(c=>`<th class="text-left px-3 py-2 whitespace-nowrap">${c[0]}</th>`).join('')}${rhS.readOnly?'':'<th class="text-left px-3 py-2">Actions</th>'}</tr></thead><tbody>
   ${data.map((r,i)=>`<tr data-i="${i}" class="cursor-pointer hover:bg-teal-50">${cols.map(c=>`<td class="px-3 py-2 ${c[1]==='remarks'?'':'whitespace-nowrap'}">${escapeHtml(r[c[1]]??'')}</td>`).join('')}${rhS.readOnly?'':`<td class="px-3 py-2 whitespace-nowrap"><button data-act="edit" data-i="${i}" class="p-1.5 rounded-lg text-slate-500 align-middle hover:text-teal-700 hover:bg-teal-50" title="Edit" aria-label="Edit"><i data-lucide="pencil" class="w-4 h-4 pointer-events-none"></i></button><button data-act="del" data-i="${i}" class="p-1.5 rounded-lg text-slate-500 align-middle hover:text-red-600 hover:bg-red-50" title="Delete" aria-label="Delete"><i data-lucide="trash-2" class="w-4 h-4 pointer-events-none"></i></button></td>`}</tr>`).join('')}</tbody></table></div>`
   :'<div class="py-6 text-center text-slate-400">No records match these filters.</div>';
  document.getElementById('rh_pi').textContent=`${rhS.total?rhS.page*RH_PAGE+1:0}–${Math.min(rhS.total,rhS.page*RH_PAGE+RH_PAGE)} of ${rhS.total}`;

  lucide.createIcons();
}

/* ---- Edit / Delete a replacement-history record ---- */
function rhEdit(r){
  if(!r) return; const ex=r.extra_data||{}, inp='w-full border border-slate-300 rounded-lg px-3 py-2 text-sm';
  const L=(t,h)=>`<div><label class="block mb-1 text-xs font-medium">${t}</label>${h}</div>`;
  openModal('Edit '+rhS.kind+' record', `<div class="font-semibold mb-1">${escapeHtml(r.vehicle_name)} <span class="font-mono text-xs text-slate-500">${escapeHtml(r.vehicle_code)}</span></div>
   <div class="text-xs text-slate-500 mb-3">${escapeHtml(r.item_name)} ${escapeHtml(r.item_code||'')}</div>
   <div class="grid grid-cols-2 gap-3">

   </div>

   <div id="rhe_err" class="text-red-600 text-xs min-h-[1rem] mt-2"></div>`,
   `<button onclick="closeModal()" class="px-3 py-1.5 text-sm border border-slate-300 rounded-lg">Cancel</button>
    <button id="rhe_save" class="px-4 py-1.5 text-sm bg-teal-600 hover:bg-teal-700 text-white rounded-lg">Save changes</button>`);
  document.getElementById('rhe_save').onclick = async ()=>{
    const er=document.getElementById('rhe_err'), date=document.getElementById('rhe_d').value;
    const q=parseFloat(document.getElementById('rhe_q').value), mv=document.getElementById('rhe_m').value.trim(), m=mv===''?null:parseFloat(mv);

    try{ await logActivity('EDIT_REPLACEMENT', RH_TABLE, r.id, `${r.vehicle_code} · ${r.item_name} · ${date}`); }catch(_){}
    closeModal(); toast('Record updated','success'); rhLoad();
  };
}
function rhDelete(r){

const BI = {

          ex:[['Truck 01','VH-001','Engine Oil','15','25000','2026-11-15','Regular replacement'],['Excavator 02','VH-002','Hydraulic Oil','20','18000','2026-11-15','Hydraulic oil changed']]},

const biExRows = k => BI[k].ex.map((r,i)=> k==='Oil' ? r.concat([(OE_PURPOSES[0]||'')]) : r);

const biCsv = rows => rows.map(r=>r.map(biCsvEsc).join(',')).join('\r\n')+'\r\n';
const biDownload = (name,text) => { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\uFEFF'+text],{type:'text/csv'})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); };
let biState = {kind:null, file:null, plan:null, busy:false, itemCache:{}};

         items = items.filter(i=>i.status!=='Inactive' && !/^(filter|oil)$/i.test((i.item_category||'').trim())); }

}

  return `<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-4" id="bi_box">
   <div class="flex items-center gap-3 mb-4"><div class="w-10 h-10 rounded-lg bg-teal-50 text-teal-700 flex items-center justify-center"><i data-lucide="upload-cloud" class="w-5 h-5"></i></div>
    <div><h3 class="font-semibold text-navy-900">Bulk Import via CSV</h3><p class="text-xs text-slate-500">Add multiple ${k.toLowerCase()} replacement records at once from a CSV file.</p></div></div>
   <div class="grid grid-cols-1 md:grid-cols-[1fr_220px] gap-3">

      <button id="bi_imp" class="bg-teal-600 hover:bg-teal-700 disabled:opacity-50 text-white rounded-lg py-2.5 text-sm font-medium flex items-center justify-center gap-2"><i data-lucide="upload-cloud" class="w-4 h-4"></i>Import CSV</button>

function biSetFile(f){

/* validate everything locally; returns {good, errors:[{line,msg,row}], dups} */
async function biValidate(k, text){
  const allowDup = !!(document.getElementById('bi_allow')||{}).checked;
  const rows = fqParseCsv(text.replace(/^\uFEFF/,'')).filter(r=>r.some(c=>String(c).trim()!==''));
  const hdr = biHeader(k);
  if (!rows.length) return {fatal:'The file is empty.'};
  const h = rows[0].map(x=>String(x).trim().toLowerCase());
  if (h.length!==hdr.length || hdr.some((c,i)=>h[i]!==c)) return {fatal:'Header must be exactly (same order): '+hdr.join(',')+'  — found: '+rows[0].join(',')};
  if (rows.length<2) return {fatal:'The file has a header but no data rows.'};
  if (rows.length>5001) return {fatal:'Too many rows (max 5000 per file).'};
  if (!fqVehicles || !fqVehicles.length) await fqLoadVehicles();
  const items = await biItems(k), today = deToday();
  const vByCode = new Map(fqVehicles.map(v=>[v.code.toLowerCase(),v]));
  const iByName = new Map(); items.forEach(i=>{ const key=i.item_name.trim().toLowerCase(); iByName.set(key, iByName.has(key)?null:i); });
  const good=[], errors=[], seen=new Set();
  rows.slice(1).forEach((r,n)=>{
    const ln=n+2, c=i=>String(r[i]??'').trim(), bad=m=>errors.push({line:ln,msg:m,row:r});
    if (r.length>hdr.length && r.slice(hdr.length).some(x=>String(x).trim())) return bad('Too many columns (extra commas? wrap text containing commas in quotes)');
    const vName=c(0), vCode=c(1), iName=c(2), qtyS=c(3), mrS=c(4), date=c(5), rem=c(6), purpose=k==='Oil'?c(7):'';
    if(!vCode) return bad('vehicle_code is empty');
    const v=vByCode.get(vCode.toLowerCase()); if(!v) return bad(`vehicle_code "${vCode}" not found in Vehicle Master`);
    if(!vName) return bad('vehicle_name is empty');
    if(v.vehicle_name.trim().toLowerCase()!==vName.toLowerCase()) return bad(`vehicle_name "${vName}" does not match Vehicle Master ("${v.vehicle_name}") for code ${v.code}`);
    if(!iName) return bad(BI[k].nameCol+' is empty');
    if(!iByName.has(iName.toLowerCase())) return bad(`${BI[k].label} "${iName}" not found among active ${k==='Other'?'Other':k} items in Item Master`);
    const it=iByName.get(iName.toLowerCase()); if(!it) return bad(`${BI[k].label} "${iName}" matches more than one Item Master record`);
    const q=Number(qtyS); if(qtyS===''||!isFinite(q)||q<0) return bad(`quantity "${qtyS}" must be a number (0 or more)`);
    let m=0; if(mrS!==''){ m=Number(mrS); if(!isFinite(m)||m<0) return bad(`meter_reading "${mrS}" must be a number 0 or more`); }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || isNaN(Date.parse(date)) || new Date(date+'T00:00:00Z').toISOString().slice(0,10)!==date) return bad(`replacement_date "${date}" must be a valid date as YYYY-MM-DD`);
    if(date>today) return bad(`replacement_date ${date} is in the future`);
    if(rem.length>500) return bad('remarks longer than 500 characters');
    if(k==='Oil' && purpose && !OE_PURPOSES.includes(purpose)) return bad(`purpose "${purpose}" must be one of: ${OE_PURPOSES.join(', ')}`);
    const key=[v.code,it.id,date,m,q].join('|');
    if(!allowDup && seen.has(key)) return errors.push({line:ln,msg:'Duplicate of an earlier row in this file',row:r,dup:true});
    seen.add(key); good.push({ln,v,it,date,q,m,rem,purpose,key,row:r});
  });
  /* duplicates already in the database (one query set per ~50 vehicles, date-bounded) */
  if (good.length && !allowDup){
    const dates=good.map(g=>g.date).sort(), lo=dates[0], hi=dates[dates.length-1], codes=[...new Set(good.map(g=>g.v.code))], exist=new Set();
    for(let i=0;i<codes.length;i+=50) for(let from=0;;from+=1000){
      const {data,error}=await db.from(RH_TABLE).select('vehicle_code,item_id,replacement_date,meter_reading,quantity').eq('entry_type',k).in('vehicle_code',codes.slice(i,i+50)).gte('replacement_date',lo).lte('replacement_date',hi).range(from,from+999);
      if(error) return {fatal:'Could not check existing records: '+error.message};
      (data||[]).forEach(r=>exist.add([r.vehicle_code,r.item_id,r.replacement_date,r.meter_reading===null?null:Number(r.meter_reading),Number(r.quantity)].join('|')));
      if(!data||data.length<1000) break; }
    for(let i=good.length-1;i>=0;i--) if(exist.has(good[i].key)){ const g=good.splice(i,1)[0]; errors.push({line:g.ln,msg:'Duplicate: identical record already exists in the system',row:g.row,dup:true}); }
  }
  errors.sort((a,b)=>a.line-b.line);
  return {good, errors, total:rows.length-1};
}
function biErrFile(k,errs){ return biCsv([['error_line','error_reason'].concat(biHeader(k))].concat(errs.map(e=>[e.line,e.msg].concat(e.row)))); }
async function biRun(){
  const k=biState.kind; if(biState.busy) return;
  if(!biState.file){ toast('Choose a CSV file first','error'); return; }
  const btn=document.getElementById('bi_imp'); biState.busy=true; btn.disabled=true; btn.textContent='Validating…';
  try{
    const res=await biValidate(k, await biState.file.text());
    if(res.fatal){ biReport(false,res.fatal); return; }
    const hard=res.errors.filter(e=>!e.dup), dups=res.errors.filter(e=>e.dup);
    const lines=res.errors.map(e=>`Row ${e.line}: ${e.msg}`);
    if(!res.good.length){ biReport(false,`Nothing to import — ${hard.length} invalid, ${dups.length} duplicate of ${res.total} rows.`,lines); return; }
    if(hard.length){ /* never silently skip: user must confirm importing only the valid rows */
      biReport(false,`${hard.length} invalid row(s) found. ${res.good.length} valid row(s) are ready.`,lines,
        `<div class="mt-2 flex gap-2"><button id="bi_go" class="bg-teal-600 text-white rounded-lg px-3 py-1.5 text-xs font-medium">Import ${res.good.length} valid row(s) only</button><button id="bi_err" class="border border-red-300 rounded-lg px-3 py-1.5 text-xs font-medium">Download error file</button></div>`);
      document.getElementById('bi_go').onclick=()=>biCommit(k,res,true);
      document.getElementById('bi_err').onclick=()=>biDownload(`${k.toLowerCase()}_import_errors.csv`,biErrFile(k,res.errors));
    } else await biCommit(k,res,false);
  }catch(e){ biReport(false,'Import failed: '+(e.message||e)); }
  finally{ biState.busy=false; btn.disabled=false; btn.innerHTML='<i data-lucide="upload-cloud" class="w-4 h-4"></i>Import CSV'; lucide.createIcons(); }
}
async function biCommit(k,res,partial){
  if(biState.busy && partial===false && false) return;
  const btn=document.getElementById('bi_imp'); biState.busy=true; btn.disabled=true;
  const go=document.getElementById('bi_go'); if(go) go.disabled=true;
  const groups=new Map(), failed=[]; let ok=0;
  res.good.forEach(g=>{ const gk=[g.v.code,g.date,g.m].join('|'); if(!groups.has(gk)) groups.set(gk,[]); const bk=groups.get(gk); let b=bk.find(x=>!x.items.has(g.it.id)); if(!b){ b={gid:rhUuid(),items:new Set()}; bk.push(b); } b.items.add(g.it.id); g.gid=b.gid; });
  const mk=g=>({...rhBase(g.v,g.it,g.date,g.q,g.m,g.rem,Object.assign({source:BI[k].src},g.purpose?{purpose:g.purpose}:{})),entry_group_id:g.gid});
  const CH=200;
  for(let i=0;i<res.good.length;i+=CH){
    const part=res.good.slice(i,i+CH); btn.textContent=`Importing ${Math.min(i+CH,res.good.length)} / ${res.good.length}…`;
    const err=await rhInsert(part.map(mk));    // single batched request per chunk
    if(err) part.forEach(g=>failed.push({line:g.ln,msg:'Database error: '+err.message,row:g.row})); else ok+=part.length;
  }
  try{ await logActivity(k.toUpperCase()+'_CSV_IMPORT',RH_TABLE,null,`${ok} records imported`); }catch(e){}
  const all=res.errors.concat(failed), dups=res.errors.filter(e=>e.dup).length, bad=all.length-dups;
  biReport(failed.length===0&&bad===0, `Import finished — Total in CSV: ${res.total} · Imported: ${ok} · Failed: ${bad} · Duplicates skipped: ${dups}`,
    all.sort((a,b)=>a.line-b.line).map(e=>`Row ${e.line}: ${e.msg}`),
    all.length?`<div class="mt-2"><button id="bi_err" class="border border-slate-300 bg-white rounded-lg px-3 py-1.5 text-xs font-medium text-slate-700">Download rows to fix &amp; re-import</button></div>`:'');
  const eb=document.getElementById('bi_err'); if(eb) eb.onclick=()=>biDownload(`${k.toLowerCase()}_import_errors.csv`,biErrFile(k,all));
  toast(`${ok} record(s) imported`,ok?'success':'error');
  biState.busy=false; btn.disabled=false; btn.innerHTML='<i data-lucide="upload-cloud" class="w-4 h-4"></i>Import CSV'; lucide.createIcons();
}
function biMount(host,k){
  biState={...biState,kind:k,file:null,busy:false};
  host.insertAdjacentHTML('afterbegin',biSection(k)); lucide.createIcons();
  const drop=document.getElementById('bi_drop'), fi=document.getElementById('bi_file');
  drop.onclick=()=>fi.click(); fi.onchange=e=>{ biSetFile(e.target.files[0]); e.target.value=''; };
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('border-teal-500','bg-teal-50');};
  drop.ondragleave=e=>{e.preventDefault();drop.classList.remove('border-teal-500','bg-teal-50');};
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('border-teal-500','bg-teal-50'); if(e.dataTransfer.files[0]) biSetFile(e.dataTransfer.files[0]); };
  document.getElementById('bi_tpl').onclick=()=>biDownload(BI[k].file,biCsv([biHeader(k)].concat(biExRows(k))));
  document.getElementById('bi_imp').onclick=biRun;
}

/* ============================================================
   MAINTENANCE INTERVAL SETTINGS / DIESEL ELIGIBILITY / CALENDAR / CHECKLIST

           maintenance_checklist_status, last_filter_consumption, last_oil_consumption, item_replacement_history

const MI_LABEL = Object.fromEntries(MI_TYPES), MI_UNIT = {Hours:'hrs',Days:'days',Kilometers:'km','Diesel Litres':'L'};

const miYmd = d => { const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
const miParse = s => { const [y,m,d]=String(s).slice(0,10).split('-').map(Number); return new Date(y,m-1,d); };
const miFmt = s => { try{ return miParse(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return s; } };
async function miInChunks(table, col, ids, sel='*'){
  let out=[]; for(let i=0;i<ids.length;i+=80){ const { data, error } = await db.from(table).select(sel).in(col, ids.slice(i,i+80)); if(error) throw error; out=out.concat(data||[]); } return out;
}

/* ---- Diesel activity (reuses oilDb.diesel_data: code, vehicle_name, entry_datetime, quantity) ---- */
async function miDieselSetting(){
  const { data } = await db.from('maintenance_app_settings').select('value').eq('key','diesel_eligibility').maybeSingle();
  const v = (data && data.value) || {}; return { enabled: v.enabled!==false, days: Number(v.days)>0 ? Number(v.days) : 14 };
}
async function miLastDiesel(codes){           // latest ACTUAL consumption date (entry_datetime) per vehicle code
  const want = new Set(codes.map(c=>String(c).toUpperCase())), map = new Map(); let from=0;
  for (let page=0; page<40; page++){
    const { data, error } = await oilDb.from('diesel_data').select('code,entry_datetime').order('entry_datetime',{ascending:false}).range(from,from+999);
    if (error) throw error;
    (data||[]).forEach(r=>{ const c=String(r.code||'').toUpperCase(); if(want.has(c) && !map.has(c)) map.set(c, r.entry_datetime); });
    if (!data || data.length<1000 || map.size>=want.size) break; from+=1000;
  }
  return map;
}
async function miEligibility(vehicles){
  const st = await miDieselSetting(), today = new Date(); today.setHours(0,0,0,0);
  const last = st.enabled ? await miLastDiesel(vehicles.map(v=>v.code)) : new Map();
  const rows = vehicles.map(v=>{
    const d = last.get(String(v.code).toUpperCase()); let days = null;
    if (d){ const dd=new Date(d); dd.setHours(0,0,0,0); days = Math.round((today-dd)/864e5); }
    return { v, last:d||null, days, eligible: !st.enabled || (days!==null && days<=st.days) };
  });
  return { st, rows, eligible:new Set(rows.filter(r=>r.eligible).map(r=>r.v.code)) };
}

async function miBulkApply(){

        rows.push({ entry_group_id: await miHashUuid('oil|'+r.code+'|'+r.entry_datetime), vehicle_name:r.vehicle_name, vehicle_code:r.code, item_id:it.id, item_name:it.item_name, item_code:it.item_code, item_category:it.item_category,
          replacement_date:miYmd(new Date(r.entry_datetime)), quantity:q, uom:it.unit||r.unit||null, meter_reading:r.meter_reading, remarks:r.remarks||null, created_at:r.entry_datetime,

        (unm.size?`<div class="mt-3 font-semibold">Unmatched oil types (review manually, add/rename in Item Master then re-run):</div><ul class="list-disc ml-5">${[...unm].map(([k,v])=>`<li>${escapeHtml(k)} — ${v} rows</li>`).join('')}</ul>`:'');
    }catch(err){ out.innerHTML=`<div class="text-red-600">${escapeHtml(err.message)}</div>`; }

async function calCompute(){

  const otherIds=[...new Set([...stdR.data.filter(s=>s.enabled).map(s=>s.item_id),...ovR.data.filter(o=>o.interval_type!=='No Interval').map(o=>o.item_id)])];
  const known=new Set(base.map(b=>b.item_id)); const itemRows=otherIds.length?await miInChunks('items','id',otherIds,'id,item_name,item_code,item_category,unit'):[]; const im=new Map(itemRows.map(i=>[i.id,i]));
  const otherItems=otherIds.filter(id=>{ const c=(im.get(id)?.item_category||'').trim().toLowerCase(); return c!=='filter'&&c!=='oil'; });
  if(otherItems.length){
    const seen=new Set(); for(let i=0;i<otherItems.length;i+=60){ let from=0; for(;;){
      const { data, error } = await db.from(RH_TABLE).select('vehicle_code,vehicle_name,item_id,item_name,item_code,item_category,replacement_date,quantity,uom,meter_reading,id,created_at').eq('entry_type','Other').in('item_id',otherItems.slice(i,i+60)).order('replacement_date',{ascending:false}).order('created_at',{ascending:false}).range(from,from+999);

      if(!data||data.length<1000) break; from+=1000; } }
  }
  /* latest known meter per vehicle (highest reading recorded in latest-replacement data) */
  const cur=new Map(); base.forEach(b=>{ const m=+b.last_meter_reading; if(m>0 && (!cur.has(b.vehicle_code)||m>cur.get(b.vehicle_code))) cur.set(b.vehicle_code,m); });

let ckItems=[];
function calOpenChecklist(vcode, key){
  const allOver=(key==='overdue'); ckItems=calData.filter(x=>x.vcode===vcode && (allOver? calStatus(x.key)==='overdue' : x.key===key)); if(!ckItems.length) return; const v=ckItems[0], today=miYmd(new Date());
  openModal(`Maintenance checklist — ${v.vname}`, `<div class="text-xs text-slate-500 mb-3">${escapeHtml(vcode)} · ${allOver?'all overdue items':'due '+miFmt(key)+' · '+CAL_LBL[calStatus(key)]}</div><div id="ck_list" class="space-y-3">
   ${ckItems.map((x,i)=>{ const pr=calPend.get(x.vcode+'|'+x.item_id); return `<div class="border border-slate-200 rounded-xl p-3" data-i="${i}">
    <div class="flex flex-wrap justify-between gap-2"><div><div class="text-sm font-semibold">${i+1}. ${escapeHtml(x.iname)}</div><div class="text-xs text-slate-500">${escapeHtml(x.cat)} · Required qty ${x.qty} ${escapeHtml(x.uom)}</div><div class="text-[11px] text-slate-400">${escapeHtml(x.note)}</div>${pr!==undefined?`<div class="text-[11px] text-amber-700 mt-1">Pending — ${escapeHtml(pr||'')}</div>`:''}</div>
    <div class="flex gap-1.5 items-start"><label class="cursor-pointer"><input type="radio" name="ck${i}" value="yes" class="peer sr-only"/><span class="block px-3 py-1.5 rounded-lg text-sm font-bold bg-slate-100 text-slate-500 peer-checked:bg-green-100 peer-checked:text-green-700">Yes</span></label><label class="cursor-pointer"><input type="radio" name="ck${i}" value="no" class="peer sr-only"/><span class="block px-3 py-1.5 rounded-lg text-sm font-bold bg-slate-100 text-slate-500 peer-checked:bg-red-100 peer-checked:text-red-700">No</span></label></div></div>
    <div class="ck-yes hidden mt-3 grid grid-cols-2 gap-2"><label class="text-xs">Actual qty<input type="number" data-f="qty" min="0" step="any" value="${x.qty}" class="${miInp} w-full"/></label><label class="text-xs">Meter reading<input type="number" data-f="meter" min="0" step="any" value="${x.meter}" class="${miInp} w-full"/></label><label class="text-xs">Replacement date<input type="date" data-f="date" max="${today}" value="${today}" class="${miInp} w-full"/></label><label class="text-xs">Remarks<input data-f="rem" class="${miInp} w-full"/></label></div>
    <div class="ck-no hidden mt-3"><label class="text-xs">Reason (required)<input data-f="reason" class="${miInp} w-full"/></label></div>
    <div class="ck-act hidden mt-3 text-right"><button data-save class="px-4 py-1.5 text-sm bg-teal-600 hover:bg-teal-700 text-white rounded-lg">Save</button></div></div>`; }).join('')}</div>`,
   `<button onclick="closeModal()" class="px-3 py-1.5 text-sm border border-slate-300 rounded-lg">Close</button>`);
  const L=document.getElementById('ck_list');
  L.addEventListener('change',e=>{ const c=e.target.closest('[data-i]'); if(!c||e.target.type!=='radio') return; const y=e.target.value==='yes'; c.querySelector('.ck-yes').classList.toggle('hidden',!y); c.querySelector('.ck-no').classList.toggle('hidden',y); c.querySelector('.ck-act').classList.remove('hidden'); });
  L.addEventListener('click',e=>{ const b=e.target.closest('button[data-save]'); if(b) ckSave(b.closest('[data-i]'), b); });
}
async function ckSave(card, btn){
  const x=ckItems[+card.dataset.i], ans=(card.querySelector('input[type=radio]:checked')||{}).value, f=k=>(card.querySelector(`[data-f=${k}]`)||{}).value||'';
  if(!ans) return; const v={vehicle_name:x.vname, code:x.vcode};
  if(ans==='no'){ const reason=f('reason').trim(); if(!reason){ toast('Enter the reason.','error'); return; }
    btn.disabled=true; const { error } = await db.from('maintenance_checklist_status').upsert({vehicle_code:x.vcode,vehicle_name:x.vname,item_id:x.item_id,item_name:x.iname,status:'Pending',reason,due_date:x.key,created_by:miUser(),updated_at:new Date().toISOString()},{onConflict:'vehicle_code,item_id'}); btn.disabled=false;
    if(error){ toast('Not saved: '+error.message,'error'); return; } calPend.set(x.vcode+'|'+x.item_id,reason); toast('Marked pending with reason','success'); card.querySelector('.ck-act').classList.add('hidden'); return; }
  const q=parseFloat(f('qty')), m=f('meter')===''?null:parseFloat(f('meter')), d=f('date');
  if(!(q>0)){ toast('Actual quantity must be greater than zero.','error'); return; } if(!d){ toast('Select the replacement date.','error'); return; } if(m!==null&&(isNaN(m)||m<0)){ toast('Invalid meter reading.','error'); return; }
  btn.disabled=true;      /* x.gid is fixed for this checklist line => double-click / retry cannot duplicate */
  const err=await rhInsert([{...rhBase(v,x.item,d,q,m,f('rem').trim()||null,{source:'checklist',scheduled_due:x.key}), entry_group_id:x.gid}]);
  if(err){ btn.disabled=false; toast('Not saved: '+err.message,'error'); return; }
  await db.from('maintenance_checklist_status').delete().eq('vehicle_code',x.vcode).eq('item_id',x.item_id); calPend.delete(x.vcode+'|'+x.item_id);
  try{ await logActivity('CHECKLIST_REPLACEMENT',RH_TABLE,null,`${x.vname} / ${x.iname}`); }catch(e){}
  calData=calData.filter(z=>!(z.vcode===x.vcode&&z.item_id===x.item_id)); toast('Replacement recorded','success');
  card.innerHTML=`<div class="text-sm text-green-700 font-medium">&#10003; ${escapeHtml(x.iname)} — completed</div>`; calRender(); if(typeof ovRender==='function') ovRender();
}

    if(!vsCfg){
      const [s,o]=await Promise.all([vsAll(()=>db.from('maintenance_interval_settings').select('*')),vsAll(()=>db.from('vehicle_interval_overrides').select('*'))]);
      const ids=[...new Set([...s.filter(x=>x.enabled).map(x=>x.item_id),...o.filter(x=>x.interval_type!=='No Interval').map(x=>x.item_id)])];
      const its=ids.length?await miInChunks('items','id',ids,'id,item_name,item_code,item_category,unit'):[];
      vsCfg={std:new Map(s.map(x=>[x.item_id,x])),ov:new Map(o.map(x=>[x.vehicle_code+'|'+x.item_id,x])),ids,im:new Map(its.map(i=>[i.id,i]))};
    }
    const v=fqVehicles.find(x=>x.code===code)||{code,vehicle_name:code};
    const [rh,dzRaw]=await Promise.all([
      vsAll(()=>db.from(RH_TABLE).select('id,replacement_date,item_id,item_name,item_code,item_category,quantity,uom,meter_reading,entry_type,created_at').eq('vehicle_code',code).order('replacement_date',{ascending:false}).order('created_at',{ascending:false}).order('id',{ascending:false})),
      vsAll(()=>oilDb.from('diesel_data').select('*').in('code',[...new Set([code,code.toUpperCase(),code.toLowerCase()])]).order('entry_datetime',{ascending:false}).order('id',{ascending:false}))]);
    const mk=dzRaw.length?(Object.keys(dzRaw[0]).find(k=>/^(meter_reading|meter|hour_meter|hmr|odometer|reading|current_meter)$/i.test(k))||Object.keys(dzRaw[0]).find(k=>/meter|hmr|odo|reading/i.test(k))):null;
    const dz=dzRaw.map(r=>({d:r.entry_datetime,q:+r.quantity||0,m:mk&&+r[mk]>0?+r[mk]:null}));
    const lastDz=dz.find(r=>r.m), cur=Math.max(lastDz?lastDz.m:0,...rh.map(r=>+r.meter_reading||0))||null;
    const eff=iid=>{ const o=vsCfg.ov.get(code+'|'+iid), s=vsCfg.std.get(iid);
      if(o) return o.interval_type==='No Interval'?null:{type:o.interval_type,val:+o.interval_value};
      return s&&s.enabled&&s.interval_type!=='No Interval'?{type:s.interval_type,val:+s.interval_value}:null; };
    const last=new Map(); rh.forEach(r=>{ if(r.item_id&&!last.has(r.item_id)) last.set(r.item_id,r); });
    const sched=[];
    vsCfg.ids.forEach(iid=>{
      const e=eff(iid); if(!e||!(e.val>0)) return; const it=vsCfg.im.get(iid)||{}, r=last.get(iid), u=MI_UNIT[e.type]||'';
      const o={name:it.item_name||(r&&r.item_name)||'—',code:it.item_code||(r&&r.item_code)||'',cat:it.item_category||(r&&r.item_category)||'',every:`Every ${vsNum(e.val)} ${u}`,
        last:r?String(r.replacement_date).slice(0,10):null,st:'norec',next:'—',left:'',over:'—',txt:''};
      if(r){
        const ld=o.last;
        if(e.type==='Days'){ const d=miParse(ld); d.setDate(d.getDate()+e.val); const k=miYmd(d), rem=calDiff(k); o.next=miFmt(k);
          if(rem<0){ o.st='overdue'; o.over=`${-rem} ${vsPl(-rem)}`; } else if(rem<=7){ o.st='upcoming'; o.left=rem===0?'Due today':`Due in ${rem} ${vsPl(rem)}`; } else { o.st='ok'; o.left=`${rem} days left`; } }
        else if(e.type==='Hours'||e.type==='Kilometers'){ const lm=+r.meter_reading;
          if(!(lm>0)||!cur){ o.st='nodata'; }
          else { const nd=lm+e.val, rem=nd-cur; o.next=`At ${vsNum(nd)} ${u}`;
            if(rem<0){ o.st='overdue'; o.over=`${vsNum(-rem)} ${u}`; } else if(rem<=e.val*0.1){ o.st='upcoming'; o.left=`${vsNum(rem)} ${u} left`; } else { o.st='ok'; o.left=`${vsNum(rem)} ${u} left`; } } }
        else if(e.type==='Diesel Litres'){ const t0=new Date(ld+'T00:00:00'), used=dz.filter(x=>new Date(x.d)>=t0).reduce((a,x)=>a+x.q,0), rem=e.val-used; o.next=`After ${vsNum(e.val)} L`;
          if(rem<0){ o.st='overdue'; o.over=`${vsNum(-rem)} L`; } else if(rem<=e.val*0.1){ o.st='upcoming'; o.left=`${vsNum(rem)} L left`; } else { o.st='ok'; o.left=`${vsNum(rem)} L left`; } }
      }
      o.txt=o.st==='upcoming'?`Upcoming · ${o.left}`:(o.st==='overdue'?'Overdue':'');
      sched.push(o);
    });
    const rank={overdue:0,upcoming:1,ok:2,nodata:3,norec:4}; sched.sort((a,b)=>rank[a.st]-rank[b.st]||a.name.localeCompare(b.name,undefined,{numeric:true}));
    vsCur={v,sched,hist:rh,dz,mk,cur,total:dz.reduce((a,x)=>a+x.q,0)};
    body.className=''; vsRender();
  }catch(err){ body.className=`${miCard} text-red-600 text-sm`; body.textContent=err.message||String(err); }
}

function vsRender(){
  const c=vsCur, body=document.getElementById('vs_body'); if(!c||!body) return;
  const {v,sched,hist,dz,mk,cur,total}=c, kind=ovKind(v.vehicle_name,v.code), cnt=s=>sched.filter(x=>x.st===s).length;
  const vis=sched.filter(x=>x.st!=='norec'||vsF.nr), shown=vis.filter(x=>vsF.st==='all'||x.st===vsF.st), hidden=sched.filter(x=>x.st==='norec').length;
  const ovl=cnt('overdue')?'overdue':cnt('upcoming')?'upcoming':cnt('ok')?'ok':null;
  const tile=(l,val)=>`<div class="min-w-0"><div class="text-[11px] text-slate-500">${l}</div><div class="text-sm font-bold text-navy-900 break-words">${val}</div></div>`;
  const th='px-3 py-2 font-semibold', td='px-3 py-2 align-top', thead=cols=>`<thead><tr class="bg-blue-50 border-b border-blue-100 text-left text-xs text-slate-600">${cols.map(x=>`<th class="${th}">${x}</th>`).join('')}</tr></thead>`;
  const chip=(f,l,n)=>`<button data-vf="${f}" class="px-2.5 py-1 rounded-full text-xs font-medium border ${vsF.st===f?'bg-navy-800 text-white border-navy-800':'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}">${l}${n==null?'':' · '+n}</button>`;
  const pager=(k,n,p)=>{ const pages=Math.max(1,Math.ceil(n/VS_PG)); return n>VS_PG?`<div class="flex items-center justify-between mt-3 text-xs text-slate-500"><span>Page ${p+1} of ${pages} · ${n} records</span><span class="flex gap-2"><button data-vp="${k}:-1" ${p<=0?'disabled':''} class="border border-slate-300 rounded-lg px-3 py-1 disabled:opacity-40">Prev</button><button data-vp="${k}:1" ${p>=pages-1?'disabled':''} class="border border-slate-300 rounded-lg px-3 py-1 disabled:opacity-40">Next</button></span></div>`:''; };
  vsF.dp=Math.min(vsF.dp,Math.max(0,Math.ceil(dz.length/VS_PG)-1)); vsF.hp=Math.min(vsF.hp,Math.max(0,Math.ceil(hist.length/VS_PG)-1));
  const nxt=x=>`<div>${escapeHtml(x.next)}</div>${x.left?`<div class="text-[11px] text-slate-400">${x.left}</div>`:''}`;
  const srows=shown.map(x=>`<tr class="border-b border-slate-100"><td class="${td}"><div class="font-medium text-slate-800">${escapeHtml(x.name)}</div><div class="text-[11px] text-slate-400">${escapeHtml(x.cat)}${x.code?' · '+escapeHtml(x.code):''}</div></td><td class="${td}">${x.every}</td><td class="${td}">${x.last?miFmt(x.last):'—'}</td><td class="${td}">${nxt(x)}</td><td class="${td} ${x.st==='overdue'?'font-semibold text-red-600':''}">${x.over}</td><td class="${td}">${vsBadge(x.st,x.txt)}</td></tr>`).join('');
  const scards=shown.map(x=>`<div class="rounded-lg border border-slate-200 p-3"><div class="flex items-start justify-between gap-2"><div class="min-w-0"><div class="font-medium text-slate-800 text-sm">${escapeHtml(x.name)}</div><div class="text-[11px] text-slate-400">${escapeHtml(x.cat)} · ${x.every}</div></div>${vsBadge(x.st,x.txt)}</div>
    <div class="grid grid-cols-2 gap-2 mt-2 text-xs"><div><div class="text-slate-500">Last service</div><b>${x.last?miFmt(x.last):'—'}</b></div><div><div class="text-slate-500">Next due</div><b>${escapeHtml(x.next)}</b></div>${x.st==='overdue'?`<div class="col-span-2 text-red-600 font-semibold">Overdue by ${x.over}</div>`:''}</div></div>`).join('');
  const dRows=dz.slice(vsF.dp*VS_PG,(vsF.dp+1)*VS_PG).map(x=>`<tr class="border-b border-slate-100"><td class="${td}">${fmtDateTime(x.d)}</td><td class="${td} text-right font-medium">${vsNum(x.q,1)}</td><td class="${td} text-right">${x.m?vsNum(x.m,1):'—'}</td></tr>`).join('');
  const hRows=hist.slice(vsF.hp*VS_PG,(vsF.hp+1)*VS_PG).map(x=>`<tr class="border-b border-slate-100"><td class="${td}">${miFmt(String(x.replacement_date).slice(0,10))}</td><td class="${td}"><span class="font-medium text-slate-800">${escapeHtml(x.item_name)}</span><span class="text-[11px] text-slate-400"> ${escapeHtml(x.item_category||'')}</span></td><td class="${td} text-right">${x.quantity!=null?vsNum(x.quantity,2)+' '+escapeHtml(x.uom||''):'—'}</td><td class="${td} text-right">${+x.meter_reading>0?vsNum(x.meter_reading,1):'—'}</td></tr>`).join('');
  const card=(t,inner)=>`<div class="${miCard}"><h4 class="text-xs font-bold uppercase tracking-wide text-slate-500 mb-3">${t}</h4>${inner}</div>`;
  body.innerHTML=`<div class="space-y-4">
   <div class="${miCard}"><div class="flex items-center gap-3"><div class="w-16 shrink-0">${ovIcon(kind)}</div>
     <div class="min-w-0"><div class="text-lg font-bold text-navy-900 leading-tight break-words">${escapeHtml(v.vehicle_name)}</div><div class="font-mono text-xs text-slate-500">${escapeHtml(v.code)} · ${OV_KIND_LABEL[kind]}</div></div>
     <div class="ml-auto">${ovl?vsBadge(ovl,ovl==='overdue'?'OVERDUE':ovl==='upcoming'?'UPCOMING':'UP TO DATE'):''}</div></div>
     <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mt-4 pt-4 border-t border-slate-100">${tile('Last Service',hist.length?miFmt(String(hist[0].replacement_date).slice(0,10)):'—')}${tile('Current Meter',cur?vsNum(cur,1):'N/A')}${tile('Last Diesel',dz.length?fmtDate(dz[0].d):'—')}${tile('Total Diesel',vsNum(total,1)+' LTR')}${tile('Diesel Entries / Services',dz.length+' / '+hist.length)}</div></div>
   ${card('Scheduled Maintenance',`<div class="flex flex-wrap items-center gap-1.5 mb-3">${chip('all','All',vis.length)}${chip('overdue','Overdue',cnt('overdue'))}${chip('upcoming','Upcoming',cnt('upcoming'))}${chip('ok','Up to date',cnt('ok'))}
      <label class="ml-auto flex items-center gap-1.5 text-xs text-slate-600"><input id="vs_nr" type="checkbox" ${vsF.nr?'checked':''}/> Show items with no service record${hidden?` (${hidden})`:''}</label></div>
     ${shown.length?`<div class="hidden md:block overflow-x-auto"><table class="w-full text-sm">${thead(['Item Name','Interval','Last Service','Next Due','Overdue By','Status'])}<tbody>${srows}</tbody></table></div><div class="md:hidden space-y-2">${scards}</div>`:'<div class="py-6 text-center text-slate-400 text-sm">No scheduled maintenance items to show.</div>'}`)}
   ${card('Diesel Consumption History',dz.length?`<div class="overflow-x-auto"><table class="w-full text-sm">${thead(['Date','Quantity (LTR)','Meter Reading'].map((x,i)=>i?`<span class="block text-right">${x}</span>`:x))}<tbody>${dRows}</tbody></table></div>${pager('d',dz.length,vsF.dp)}${mk?'':'<div class="text-[11px] text-slate-400 mt-2">No meter column found in diesel records.</div>'}`:'<div class="py-4 text-center text-slate-400 text-sm">No diesel consumption records.</div>')}
   ${card('Maintenance History',hist.length?`<div class="overflow-x-auto"><table class="w-full text-sm">${thead(['Date','Item',`<span class="block text-right">Quantity</span>`,`<span class="block text-right">Meter</span>`])}<tbody>${hRows}</tbody></table></div>${pager('h',hist.length,vsF.hp)}`:'<div class="py-4 text-center text-slate-400 text-sm">No maintenance records.</div>')}
  </div>`;
}
</script>
</body>
</html>
