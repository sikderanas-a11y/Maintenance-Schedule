/* ============================================================
   CUSTOM AUTH (no Supabase Auth)
   - user_credentials table: { email, password_hash, salt, profile_id }
   - hash = sha256(salt + password)  (hex)
   - session stored in localStorage: { profileId, email, ts }
   ============================================================ */
const SESSION_KEY = 'vmsp_session';

async function sha256Hex(text){
  const buf = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function randomSalt(len=24){
  const arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function saveSession(profile){
  localStorage.setItem(SESSION_KEY, JSON.stringify({
    profileId: profile.id, email: profile.email, ts: Date.now()
  }));
}
function loadSession(){
  try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch(e){ return null; }
}
function clearSession(){ localStorage.removeItem(SESSION_KEY); }

function badge(s){ const c = STATUS_COLORS[s]||'bg-slate-100 text-slate-700';
  return `<span class="badge ${c}">${escapeHtml(s||'')}</span>`; }

function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function toast(msg, type='info'){

  box.innerHTML = `<i data-lucide="${type==='success'?'check-circle':type==='error'?'alert-circle':'info'}" class="w-5 h-5 shrink-0"></i> <span>${escapeHtml(msg)}</span>`;

/* ============================================================
   AUTH  (custom — no Supabase Auth)
   ============================================================ */
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const errBox = document.getElementById('loginError');
  errBox.classList.add('hidden');
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass  = document.getElementById('loginPassword').value;
  if (!email || !pass){ errBox.textContent='Enter email and password.'; errBox.classList.remove('hidden'); return; }

  // fetch credentials row by email
  const { data: cred, error: ce } = await db.from('user_credentials')
    .select('id, email, password_hash, salt, profile_id, status')
    .eq('email', email).maybeSingle();
  if (ce){ errBox.textContent = ce.message; errBox.classList.remove('hidden'); return; }
  if (!cred){ errBox.textContent='Invalid email or password.'; errBox.classList.remove('hidden'); return; }
  if (cred.status === 'Disabled'){ errBox.textContent='Your account is disabled. Contact admin.'; errBox.classList.remove('hidden'); return; }

  // hash input password with stored salt, compare
  const inputHash = await sha256Hex(cred.salt + pass);
  if (inputHash !== cred.password_hash){
    errBox.textContent='Invalid email or password.'; errBox.classList.remove('hidden'); return;
  }

  // load profile
  const { data: prof, error: pe } = await db.from('profiles')
    .select('*').eq('id', cred.profile_id).maybeSingle();
  if (pe || !prof){ errBox.textContent='Profile load failed.'; errBox.classList.remove('hidden'); return; }
  if (prof.account_status === 'Disabled'){ errBox.textContent='Your account is disabled.'; errBox.classList.remove('hidden'); return; }

  // update last_login_at
  await db.from('user_credentials').update({last_login_at: new Date().toISOString()}).eq('id', cred.id);

  saveSession(prof);
  await initApp(prof);
});

async function logout(){
  clearSession();
  currentUser = null; permissions = null;
  location.reload();
}

/* On page load — auto-login if a valid session exists */
window.addEventListener('DOMContentLoaded', async ()=>{
  const sess = loadSession();
  if (!sess || !sess.profileId) return;
  const { data: prof } = await db.from('profiles').select('*').eq('id', sess.profileId).maybeSingle();
  if (!prof || prof.account_status === 'Disabled'){ clearSession(); return; }
  // verify credentials still Active
  const { data: cred } = await db.from('user_credentials').select('status').eq('email', prof.email).maybeSingle();
  if (!cred || cred.status === 'Disabled'){ clearSession(); return; }
  await initApp(prof);
});

async function initApp(prof){
  if (!prof) return;

  // load permissions
  let { data: perms } = await db.from('user_permissions').select('*').eq('user_id', prof.id).maybeSingle();
  if (!perms && prof.role === 'Super Admin'){
    const full = {user_id: prof.id, dash_main:true,dash_vehicle_maintenance:true,dash_pending_maintenance:true,
      dash_item_requirement:true,dash_rom:true,dash_supply_chain:true,dash_vehicle_master:true,
      dash_item_master:true,dash_data_entry:true,dash_maintenance_history:true,dash_user_access:true,dash_reports:true,dash_settings:true,dash_maint_calendar:true,dash_maint_settings:true};
    await db.from('user_permissions').insert(full);
    ({ data: perms } = await db.from('user_permissions').select('*').eq('user_id', prof.id).maybeSingle());
  }
  if (!perms){
    perms = {dash_main:true,dash_settings:true};
  }
  currentUser = prof;
  permissions = perms;

  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  buildSwitcher();
  lucide.createIcons();
  route('home');
}

/* ============================================================
   SIDEBAR / ROUTER
   ============================================================ */
/* ---------- Page-level access ----------
   Several pages share one legacy permission key (e.g. all Data Entry pages -> dash_data_entry).
   Each of those pages also gets its own optional column pg_<page>. Rule:
     pg_<page> true/false  -> explicit per-page setting
     pg_<page> null/absent -> fall back to the legacy shared key (existing users keep their access) */
const PG_SHARED = (()=>{ const c={}; Object.values(PAGES).forEach(p=>{ if(!p.superOnly&&!p.noPg) c[p.key]=(c[p.key]||0)+1; }); return new Set(Object.keys(PAGES).filter(k=>!PAGES[k].superOnly && !PAGES[k].noPg && c[PAGES[k].key]>1)); })();
function pageAllowedFor(perms, name, role){
  const p = PAGES[name]; if (!p) return false;
  if (role==='Super Admin') return true;
  if (p.superOnly) return false;
  perms = perms||{};
  if (PG_SHARED.has(name)){ const v = perms['pg_'+name]; if (v!==undefined && v!==null) return !!v; }
  return !!perms[p.key] || (name==='change_password' && !!perms.dash_settings);
}
const pageAllowed = name => pageAllowedFor(permissions, name, currentUser && currentUser.role);
const pgReady = () => !!permissions && PG_SHARED.size>0 && ('pg_'+[...PG_SHARED][0]) in permissions;
/* ============================================================
   LANDING PAGE (application portal) + top-bar page switcher
   ============================================================ */
const PAGE_CATS = {
  'Overview':{c:'#2563eb',t:'#dbeafe'}, 'Maintenance':{c:'#d97706',t:'#fef3c7'}, 'Requirements':{c:'#0d9488',t:'#ccfbf1'},
  'Approval':{c:'#7c3aed',t:'#ede9fe'}, 'Supply Chain':{c:'#4f46e5',t:'#e0e7ff'}, 'Data Entry':{c:'#16a34a',t:'#dcfce7'},
  'Records':{c:'#0891b2',t:'#cffafe'}, 'History & Analysis':{c:'#db2777',t:'#fce7f3'}, 'Master Data':{c:'#78716c',t:'#e7e5e4'},

function route(name){
  if (name==='home') return renderHome();
  if (!PAGES[name]) name='dashboard';
  swClose(); route.current=name;
  const p = PAGES[name];
  if (p.superOnly && currentUser.role !== 'Super Admin'){ toast('Only a Super Admin can open this page.','error'); return; }
  if (!pageAllowed(name)){
    toast('No access to this page.','error'); return;
  }
  setHeader(p.label, 'X Ceramics Ltd (Automobile) · Concept of ROM');
  document.querySelectorAll('.sw-item').forEach(b=>{ const on=b.dataset.route===name; b.classList.toggle('ring-2',on); b.classList.toggle('ring-teal-500',on); });
  const page = document.getElementById('page');
  page.innerHTML = `<div class="text-slate-400 text-sm">Loading…</div>`;

  renderer(page).catch(err=>{ page.innerHTML = `<div class="text-red-600 text-sm">Error: ${escapeHtml(err.message)}</div>`; });

async function loadVehicles(){
  const { data, error } = await db.from('vehicle_master').select('*').order('vehicle_name');
  if (error) throw error; return (data||[]).map(v=>({...v, registration_number:v.code}));
}
async function loadItems(){
  /* Supabase returns at most 1000 rows per request, so page through the whole table */
  let all=[];
  for (let from=0;;from+=1000){
    const { data, error } = await db.from('items').select('*').order('created_at',{ascending:false}).order('id',{ascending:true}).range(from,from+999);
    if (error) throw error; all=all.concat(data||[]); if (!data || data.length<1000) break;
  }
  return all;
}

function _dlgClose(host, onKey){ host.innerHTML=''; document.removeEventListener('keydown', onKey); }
function confirmDialog(message, opts={}){
  const { title='Please confirm', confirmText='Confirm', cancelText='Cancel', danger=false, icon=danger?'trash-2':'help-circle' } = opts;
  return new Promise(resolve=>{
    const host = document.getElementById('dialogHost');
    const tone = danger ? {bg:'bg-red-50', fg:'text-red-600', btn:'bg-red-600 hover:bg-red-700'} : {bg:'bg-teal-50', fg:'text-teal-600', btn:'bg-teal-600 hover:bg-teal-700'};
    host.innerHTML = `
     <div class="fixed inset-0 z-[70] flex items-center justify-center p-4">
       <div class="absolute inset-0 modal-bg dlg-bg" data-dlg="cancel"></div>
       <div class="dlg-card relative bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 text-center" role="alertdialog" aria-modal="true">
         <div class="mx-auto w-12 h-12 rounded-full ${tone.bg} ${tone.fg} flex items-center justify-center mb-3"><i data-lucide="${icon}" class="w-6 h-6"></i></div>
         <h3 class="text-lg font-semibold text-navy-900 mb-1">${escapeHtml(title)}</h3>
         <p class="text-sm text-slate-500 mb-5">${escapeHtml(message)}</p>
         <div class="flex gap-2 justify-center">
           <button data-dlg="cancel" class="flex-1 px-4 py-2 text-sm font-medium border border-slate-300 rounded-lg hover:bg-slate-50">${escapeHtml(cancelText)}</button>
           <button data-dlg="ok" id="dlgOk" class="flex-1 px-4 py-2 text-sm font-medium text-white rounded-lg ${tone.btn}">${escapeHtml(confirmText)}</button>
         </div>
       </div>
     </div>`;
    lucide.createIcons();
    const done = v=>{ _dlgClose(host, onKey); resolve(v); };
    const onKey = e=>{ if(e.key==='Escape') done(false); if(e.key==='Enter') done(true); };
    document.addEventListener('keydown', onKey);
    host.querySelectorAll('[data-dlg]').forEach(b=>b.addEventListener('click',()=>done(b.dataset.dlg==='ok')));
    document.getElementById('dlgOk').focus();
  });
}
function promptDialog(message, opts={}){
  const { title='Enter a value', confirmText='Save', cancelText='Cancel', placeholder='', type='text', icon='key-round' } = opts;
  return new Promise(resolve=>{
    const host = document.getElementById('dialogHost');
    host.innerHTML = `
     <div class="fixed inset-0 z-[70] flex items-center justify-center p-4">
       <div class="absolute inset-0 modal-bg dlg-bg" data-dlg="cancel"></div>

         <h3 class="text-lg font-semibold text-navy-900 mb-1 text-center">${escapeHtml(title)}</h3>
         <p class="text-sm text-slate-500 mb-4 text-center">${escapeHtml(message)}</p>
         <input id="dlgInput" type="${type}" placeholder="${escapeHtml(placeholder)}" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm mb-5"/>
         <div class="flex gap-2">
           <button data-dlg="cancel" class="flex-1 px-4 py-2 text-sm font-medium border border-slate-300 rounded-lg hover:bg-slate-50">${escapeHtml(cancelText)}</button>
           <button data-dlg="ok" class="flex-1 px-4 py-2 text-sm font-medium text-white rounded-lg bg-teal-600 hover:bg-teal-700">${escapeHtml(confirmText)}</button>
         </div>
       </div>
     </div>`;
    lucide.createIcons();
    const inp = document.getElementById('dlgInput');
    const done = ok=>{ const v = ok ? inp.value : null; _dlgClose(host, onKey); resolve(v); };
    const onKey = e=>{ if(e.key==='Escape') done(false); if(e.key==='Enter') done(true); };
    document.addEventListener('keydown', onKey);
    host.querySelectorAll('[data-dlg]').forEach(b=>b.addEventListener('click',()=>done(b.dataset.dlg==='ok')));
    inp.focus();
  });
}

function renderCharts(maintData, reqData){
  const R = window.Recharts;
  if (!R) return;
  const Palette = ['#0f766e','#0d9488','#14b8a6','#06b6d4','#3b82f6','#8b5cf6','#f59e0b','#ef4444','#10b981','#64748b'];

  function renderPie(elId, data){
    const el = document.getElementById(elId);
    if (!el) return;
    if (!data.length){ el.innerHTML = `<div class="text-sm text-slate-400 text-center pt-12">No data</div>`; return; }
    ReactDOM?undefined:undefined;
    // Recharts UMD exposes React hooks via window.React? It bundles its own React. Use createRoot from react-dom umd if available; otherwise use simple bar via SVG fallback.
    if (!window.ReactDOM || !window.React){
      // fallback simple bar
      let max = Math.max(...data.map(d=>d.value),1);
      el.innerHTML = data.map((d,i)=>`
        <div class="flex items-center gap-3 mb-2">
          <div class="w-40 text-xs">${escapeHtml(d.name)}</div>
          <div class="flex-1 bg-slate-100 rounded h-5 relative">
            <div style="width:${(d.value/max*100)}%;background:${Palette[i%Palette.length]}" class="h-5 rounded"></div>
          </div>
          <div class="w-8 text-xs font-semibold">${d.value}</div>
        </div>`).join('');
      return;
    }
    const root = ReactDOM.createRoot(el);
    root.render(
      React.createElement(R.ResponsiveContainer, {width:'100%',height:240},
        React.createElement(R.PieChart, null,
          React.createElement(R.Pie, {data, dataKey:'value', nameKey:'name', cx:'50%',cy:'50%',outerRadius:80,label:true},
            data.map((d,i)=>React.createElement(R.Cell,{key:i,fill:Palette[i%Palette.length]}))),
          React.createElement(R.Tooltip,null),
          React.createElement(R.Legend,null)
        )
      )
    );
  }
  renderPie('chartMaint', maintData);
  renderPie('chartReq', reqData);
}

async function saveMaintenance(id){
  const form = document.getElementById('maintForm');
  const vSel = document.getElementById('f_vehicle');
  const vehicleId = vSel.value;
  if (!vehicleId){ toast('Select a vehicle.','error'); return; }
  const vName = vSel.options[vSel.selectedIndex].dataset.name;
  const vReg  = vSel.options[vSel.selectedIndex].dataset.reg;
  const payload = {
    vehicle_id: vehicleId,
    vehicle_name: vName,
    registration_number: vReg,
    maintenance_item: document.getElementById('f_item').value.trim(),
    maintenance_description: document.getElementById('f_desc').value.trim(),
    required_work: document.getElementById('f_work').value.trim(),
    maintenance_required_date: document.getElementById('f_reqdate').value,
    planned_repair_date: document.getElementById('f_plan').value||null,
    status: document.getElementById('f_status').value,
    remarks: document.getElementById('f_remarks').value.trim(),
    submitted_by: currentUser.id,
    expected_completion_date: document.getElementById('f_plan').value||null,
  };
  if (!payload.maintenance_item || !payload.maintenance_required_date){ toast('Fill required fields.','error'); return; }
  if (payload.status==='Pending with Reason'){
    const reason = document.getElementById('f_reason').value.trim();
    if (!reason){ toast('Enter pending reason.','error'); return; }
  }
  let res;
  if (id){
    res = await db.from('maintenance_records').update(payload).eq('id', id);
    await logActivity('UPDATE_MAINTENANCE','maintenance_records', id, `Updated ${payload.vehicle_name} - ${payload.maintenance_item}`);
  } else {
    res = await db.from('maintenance_records').insert(payload).select().single();
    if (!res.error){
      const newId = res.data.id;
      await logActivity('CREATE_MAINTENANCE','maintenance_records', newId, `Created ${payload.vehicle_name} - ${payload.maintenance_item}`);
      if (payload.status==='Pending with Reason'){
        const reason = document.getElementById('f_reason').value.trim();
        await db.from('maintenance_pending_reasons').insert({
          maintenance_id:newId, reason, expected_completion_date: payload.expected_completion_date,
          created_by: currentUser.id
        });
      }
    }
  }
  if (res.error){ toast(res.error.message,'error'); return; }
  toast('Saved successfully','success'); closeModal(); refreshMaintenance();
}

async function saveEditReq(){
  if (!ER) return; const r = ER.r;
  const val = document.getElementById('er_item').value.trim();
  let itemName=r.item_name, itemCode=r.item_code||null, itemId=r.item_id||null;
  if (val!==ER.origLabel){
    const it = ER.map.get(val);
    if (!it){ toast('Pick an item from the suggestions list.','error'); return; }
    itemName=it.item_name; itemCode=it.item_code||null; itemId=reqIsUuid(it.id)?it.id:null;
  }
  const qty=parseFloat(document.getElementById('er_qty').value);
  if (!(qty>0)){ toast('Enter a valid quantity.','error'); return; }
  const need=document.getElementById('er_need').value; if(!need){ toast('Enter need by date.','error'); return; }
  const uom=document.getElementById('er_uom').value;
  const upd = { item_id:itemId, item_name:itemName, item_code:itemCode, required_quantity:qty, uom, need_by_date:need,
    pr_number:document.getElementById('er_pr').value.trim()||null,
    description:document.getElementById('er_desc').value.trim(), remarks:document.getElementById('er_rem').value.trim() };
  const btn=document.getElementById('er_save'); btn.disabled=true;
  const { data: cur } = await db.from('item_requirements').select('status').eq('id', r.id).maybeSingle();   // re-check right before saving
  if (!cur || cur.status!=='Submitted to ROM'){ btn.disabled=false; toast('ROM has already started processing this requirement; it can no longer be edited.','error'); ER=null; closeModal(); refreshRequirements(); return; }
  const strip = o => { const c={...o}; delete c.uom; delete c.item_code; c.description=((o.description||'')+' [UoM: '+o.uom+']').trim(); return c; };
  let res = await db.from('item_requirements').update(REQ_EXTRA_COLS===false?strip(upd):upd).eq('id', r.id).select('id');
  if (res.error && REQ_EXTRA_COLS!==false && reqIsMissingCol(res.error)){ REQ_EXTRA_COLS=false; res = await db.from('item_requirements').update(strip(upd)).eq('id', r.id).select('id'); }
  if (res.error){ btn.disabled=false; toast(res.error.message,'error'); return; }
  if (!res.data || !res.data.length){ btn.disabled=false; toast('Nothing was updated (no permission or record missing).','error'); return; }
  try{ await logActivity('UPDATE_ITEM_REQUIREMENT','item_requirements', r.id, `${r.requirement_id} - ${itemName} x${qty} ${uom}`); }catch(e){}
  toast('Requirement updated','success'); ER=null; closeModal(); refreshRequirements();
}
async function deleteReq(id){
  const { data: r } = await db.from('item_requirements').select('*').eq('id', id).maybeSingle();
  if (!r){ toast('Requirement not found.','error'); refreshRequirements(); return; }
  if (r.status!=='Submitted to ROM'){ toast('This requirement has already been processed and can no longer be deleted.','error'); refreshRequirements(); return; }
  if (!await confirmDialog(`${r.requirement_id} · ${r.item_name} × ${r.required_quantity} for ${r.vehicle_name} will be permanently deleted.`, {title:'Delete requirement?', confirmText:'Delete', danger:true})) return;
  const { data:del, error } = await db.from('item_requirements').delete().eq('id', id).select('id');
  if (error){ toast(error.message,'error'); return; }
  if (!del || !del.length){ toast('Nothing was deleted (no permission or already removed).','error'); refreshRequirements(); return; }
  if (r.maintenance_id){   // un-link a maintenance record that was waiting on this requirement
    try{ await db.from('maintenance_records').update({status:'Maintenance Required', item_requirement_id:null}).eq('id', r.maintenance_id).eq('item_requirement_id', id).eq('status','Item Requirement Pending'); }catch(e){}
  }
  try{ await logActivity('DELETE_ITEM_REQUIREMENT','item_requirements', id, `${r.requirement_id} - ${r.item_name} x${r.required_quantity}`); }catch(e){}
  toast('Requirement deleted','success'); refreshRequirements();
}
/* ---------- A4 PDF receipt (material requisition acknowledgement) ---------- */
function reqQrDataUrl(text){
  try{
    const d=document.createElement('div'); d.style.cssText='position:fixed;left:-9999px;top:0';
    document.body.appendChild(d);
    new QRCode(d,{text:String(text),width:160,height:160,correctLevel:QRCode.CorrectLevel.M});
    const c=d.querySelector('canvas'); const url=c?c.toDataURL('image/png'):null; d.remove(); return url;
  }catch(e){ return null; }
}
function reqMakeReceipt(recs, ctx){
  const J = window.jspdf && window.jspdf.jsPDF;
  if (!J || !recs || !recs.length) return false;
  ctx = ctx || {};
  const doc = new J({unit:'mm', format:'a4', orientation:'portrait'});
  const W=210, H=297, M=14, CW=W-2*M, FOOT=22;
  const NAVY=[15,42,74], TEAL=[13,148,136], GREY=[100,116,139], INK=[30,41,59], LIGHT=[241,245,249], LINE=[203,213,225];
  const T = s => String(s==null||s===''?'-':s).replace(/[\u2013\u2014]/g,'-').replace(/\u2192/g,'to');
  const dt = (d,time) => { if(!d) return '-'; try{ const o={day:'2-digit',month:'short',year:'numeric'}; if(time){o.hour='2-digit';o.minute='2-digit';} return new Date(d).toLocaleString('en-GB',o);}catch(e){return String(d);} };
  const first=recs[0], last=recs[recs.length-1];
  const rcpNo = 'RCP-'+String(first.requirement_id||'').replace(/^REQ-/,'');
  const idRange = (recs.length>1 && first.requirement_id!==last.requirement_id) ? `${first.requirement_id} to ${last.requirement_id}` : T(first.requirement_id);
  const nVeh = new Set(recs.map(r=>(r.registration_number||'')+'|'+(r.vehicle_name||''))).size;
  const nItm = new Set(recs.map(r=>(r.item_code||'')+'|'+(r.item_name||''))).size;
  const sub = ctx.submitter || {};
  const submittedAt = first.submission_date || new Date().toISOString();
  let y=0;

  /* --- first-page header band --- */
  doc.setFillColor(...NAVY); doc.rect(0,0,W,30,'F');
  doc.setFillColor(...TEAL); doc.roundedRect(M,8,14,14,2,2,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('VM',M+7,16.6,{align:'center'});
  doc.setFontSize(13); doc.text('X Ceramics Ltd (Automobile)',M+19,13.5);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.text('Concept of ROM',M+19,18.5);
  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.text('ITEM REQUIREMENT RECEIPT',W-M,14,{align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.text('Acknowledgement of requisition submission',W-M,19.5,{align:'right'});
  doc.setFillColor(...TEAL); doc.rect(0,30,W,1.2,'F');

  /* --- meta panel --- */
  y=37; const mh=42;
  doc.setDrawColor(...LINE); doc.setLineWidth(.3); doc.setFillColor(255,255,255); doc.roundedRect(M,y,CW,mh,1.5,1.5,'FD');
  const field=(label,val,x,yy,w)=>{ doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(...GREY); doc.text(label.toUpperCase(),x,yy);
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...INK); const ls=doc.splitTextToSize(T(val),w); doc.text(ls.slice(0,2),x,yy+4.2); };
  field('Receipt No.', rcpNo, M+4, y+6, 52);
  field('Date & Time', dt(submittedAt,true), M+4, y+17, 52);
  field('Submitted By', sub.full_name||sub.email||'-', M+4, y+28, 52);
  field('Department', sub.department||'-', M+60, y+6, 46);
  field('Need-By Date', dt(first.need_by_date), M+60, y+17, 46);
  field('PR Number', first.pr_number||'-', M+60, y+28, 46);
  field('Status', first.status||'Submitted to ROM', M+108, y+6, 38);
  field('Requirement IDs', idRange, M+108, y+17, 38);
  field('Linked Maintenance', ctx.maint||'None', M+108, y+28, 38);
  const qr = reqQrDataUrl(`${rcpNo}|${idRange}`);
  if (qr){ doc.addImage(qr,'PNG',W-M-27,y+5,23,23); doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(...GREY); doc.text('Scan to verify',W-M-15.5,y+32,{align:'center'}); }
  y += mh+5;

  /* --- summary strip --- */
  const sw=(CW-8)/3;
  [['Vehicles',nVeh],['Distinct Items',nItm],['Requirement Records',recs.length]].forEach((s,i)=>{
    const x=M+i*(sw+4); doc.setFillColor(...LIGHT); doc.roundedRect(x,y,sw,12,1.5,1.5,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(...NAVY); doc.text(String(s[1]),x+4,y+8.2);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...GREY); doc.text(s[0],x+sw-4,y+7.6,{align:'right'});
  });
  y += 17;

  /* --- table --- */
  const cols=[['S/N',10,'c'],['Req. ID',30,'l'],['Vehicle',52,'l'],['Item',62,'l'],['Qty',14,'r'],['UoM',14,'c']];
  const colX=[]; { let x=M; cols.forEach(c=>{ colX.push(x); x+=c[1]; }); }
  const runHead=()=>{ doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...GREY);
    doc.text(`Item Requirement Receipt  |  ${rcpNo}  (continued)`,M,12); doc.setDrawColor(...LINE); doc.line(M,14,W-M,14); };
  const tHead=()=>{ doc.setFillColor(...NAVY); doc.rect(M,y,CW,7.5,'F'); doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
    cols.forEach((c,i)=>{ const tx = c[2]==='c'?colX[i]+c[1]/2 : c[2]==='r'?colX[i]+c[1]-2 : colX[i]+2; doc.text(c[0],tx,y+5,{align:c[2]==='c'?'center':c[2]==='r'?'right':'left'}); });
    y+=7.5; };
  const need = h => { if (y+h > H-FOOT){ doc.addPage(); runHead(); y=20; tHead(); } };
  tHead();
  recs.forEach((r,n)=>{
    const vL = doc.splitTextToSize(T(r.vehicle_name),cols[2][1]-4);
    const iL = doc.splitTextToSize(T(r.item_name),cols[3][1]-4);
    const lines = Math.max(vL.length+1, iL.length+(r.item_code?1:0), 1);
    const rh = Math.max(8, lines*4.1+3.2);
    need(rh);
    if (n%2===0){ doc.setFillColor(248,250,252); doc.rect(M,y,CW,rh,'F'); }
    doc.setDrawColor(...LINE); doc.setLineWidth(.2); doc.line(M,y+rh,M+CW,y+rh);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...INK);
    doc.text(String(n+1),colX[0]+cols[0][1]/2,y+5,{align:'center'});
    doc.setFont('courier','normal'); doc.setFontSize(8); doc.text(T(r.requirement_id),colX[1]+2,y+5);
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.text(vL,colX[2]+2,y+5);
    doc.setFont('courier','normal'); doc.setFontSize(7.5); doc.setTextColor(...GREY); doc.text(T(r.registration_number||''),colX[2]+2,y+5+vL.length*4.1);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...INK); doc.text(iL,colX[3]+2,y+5);
    if (r.item_code){ doc.setFont('courier','normal'); doc.setFontSize(7.5); doc.setTextColor(...GREY); doc.text(T(r.item_code),colX[3]+2,y+5+iL.length*4.1); }
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...INK); doc.text(String(r.required_quantity),colX[4]+cols[4][1]-2,y+5,{align:'right'});
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.text(T(r.uom||'PCS'),colX[5]+cols[5][1]/2,y+5,{align:'center'});
    y+=rh;
  });
  doc.setDrawColor(...NAVY); doc.setLineWidth(.5); doc.line(M,y,M+CW,y);
  y+=6;

  /* --- description / remarks --- */
  const notes=[['Requirement Description',first.description],['Remarks',first.remarks]].filter(n=>n[1]&&String(n[1]).trim());
  notes.forEach(([lab,txt])=>{
    const ls=doc.splitTextToSize(T(String(txt).replace(/\s*\[UoM:[^\]]*\]\s*$/,'')),CW-8); const h=Math.min(ls.length,12)*4.2+11;
    need(h+2);
    doc.setDrawColor(...LINE); doc.setLineWidth(.3); doc.roundedRect(M,y,CW,h,1.5,1.5,'S');
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(...GREY); doc.text(lab.toUpperCase(),M+4,y+5.5);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...INK); doc.text(ls.slice(0,12),M+4,y+11);
    y+=h+4;
  });

  /* --- workflow + signatures --- */
  need(52);
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...NAVY); doc.text('APPROVAL WORKFLOW',M,y+3);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...GREY);
  doc.text('1. Requester submits   >   2. ROM reviews and confirms quantity   >   3. Supply Chain schedules delivery',M,y+8);
  y+=15;
  const gw=(CW-8)/3;
  [['Requested By',sub.full_name||sub.email||''],['Reviewed By (ROM)',''],['Received By (Supply Chain)','']].forEach((s,i)=>{
    const x=M+i*(gw+4);
    doc.setDrawColor(...INK); doc.setLineWidth(.3); doc.line(x,y+16,x+gw,y+16);
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(...INK); doc.text(s[0],x,y+21);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...GREY);
    doc.text(s[1]?T(s[1]):'Name / Signature',x,y+25.5); doc.text('Date: ____ / ____ / ________',x,y+30);
  });

  /* --- footer + page numbers on every page --- */
  const pages=doc.getNumberOfPages();
  for (let p=1;p<=pages;p++){
    doc.setPage(p);
    doc.setDrawColor(...LINE); doc.setLineWidth(.3); doc.line(M,H-17,W-M,H-17);
    doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(...GREY);
    doc.text('Computer-generated receipt confirming that the requirement was submitted. Submission does not guarantee approval or delivery;',M,H-13);
    doc.text('quantities and dates remain subject to ROM review and Supply Chain scheduling.',M,H-9.6);
    doc.text(`Generated ${dt(new Date().toISOString(),true)}`,M,H-5.5);
    doc.text(`${rcpNo}   |   Page ${p} of ${pages}`,W-M,H-5.5,{align:'right'});
  }
  doc.save(`Receipt_${rcpNo}.pdf`);
  return true;
}
async function reqReceiptFor(id){
  const { data: r } = await db.from('item_requirements').select('*').eq('id', id).maybeSingle();
  if (!r){ toast('Requirement not found.','error'); return; }
  const users = await reqLoadUsers(); const u = r.submitted_by ? users.get(String(r.submitted_by)) : null;
  let maint=null;
  if (r.maintenance_id){ try{ const { data:m } = await db.from('maintenance_records').select('vehicle_name, maintenance_item').eq('id', r.maintenance_id).maybeSingle(); if(m) maint=`${m.vehicle_name} - ${m.maintenance_item}`; }catch(e){} }
  try{ if (!reqMakeReceipt([r], {submitter:u||{}, maint})) toast('PDF library not loaded. Check your internet connection.','error'); }
  catch(e){ console.error(e); toast('Could not create the receipt: '+e.message,'error'); }
}

async function reqAfterSave(){

/* ---- Item Requirement form: searchable items, multiple items, multiple vehicles ---- */
const REQ_UOMS = ['PCS','SET','LTR','KG','M','BOX','ROLL','OTHER'];
const REQ_UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
let REQ = null;             // state of the currently open form
let REQ_HOST = null;        // the page element that holds the requirement list / inline form
let REQ_EXTRA_COLS = null;  // null = unknown yet; true/false once the DB has told us if item_requirements has uom / item_code
const reqAlnum = s => String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]/g,'');
const reqIsUuid = v => REQ_UUID_RE.test(String(v==null?'':v));
const reqRow = uid => REQ.rows.find(r=>r.uid===uid);
const reqNewRow = () => ({uid:'ri'+(++REQ.seq), item:null, qty:'1', uom:'PCS', q:''});
const reqVehCode = v => v.code || v.registration_number || '';
const reqItemLabel = i => `${i.item_name}${i.item_code?' ('+i.item_code+')':''}`;
function reqMatch(hay, q){
  const toks = String(q||'').toLowerCase().split(/\s+/).filter(Boolean);
  if (!toks.length) return true;
  const h = String(hay||'').toLowerCase(), hn = reqAlnum(hay);
  return toks.every(t=>{ const tn = reqAlnum(t); return h.includes(t) || (tn && hn.includes(tn)); });
}

function reqShowDD(uid){
  const r=reqRow(uid), dd=document.getElementById('ri_dd_'+uid); if(!r||!dd) return;
  const q=(r.q||'').trim();
  if (!q){
    dd.innerHTML = `<div class="px-3 py-2 text-xs text-slate-500">Type an item name or code to search ${REQ.idx.length.toLocaleString()} items…</div>`;
  } else {
    const taken = new Set(REQ.rows.filter(x=>x.uid!==uid && x.item).map(x=>String(x.item.id)));
    const ql=q.toLowerCase(), toks=ql.split(/\s+/).filter(Boolean), tns=toks.map(reqAlnum);
    const hits=[];
    for (const e of REQ.idx){
      let ok=true;
      for (let k=0;k<toks.length;k++){ if(!(e.h.includes(toks[k]) || (tns[k] && e.hn.includes(tns[k])))){ ok=false; break; } }
      if (ok) hits.push(e);
    }
    const score = e => e.n.startsWith(ql)?0 : e.n.includes(ql)?1 : 2;
    hits.sort((a,b)=>score(a)-score(b) || (a.n<b.n?-1:a.n>b.n?1:0));

        + (hits.length>shown.length ? `<div class="px-3 py-2 text-xs text-slate-500 bg-slate-50">Showing ${shown.length} of ${hits.length} matches — keep typing to narrow down.</div>` : '')
      : `<div class="px-3 py-2 text-xs text-slate-500">No items match “${escapeHtml(q)}”.</div>`;

}

/* ---------- save ---------- */
/* One submission = one request number: DDMMYY + 4-digit daily sequence (e.g. 1911260001). All vehicle x item records of a submission share it. */
async function reqNextSubmissionId(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const prefix = p(d.getDate())+p(d.getMonth()+1)+p(d.getFullYear()%100);
  let seq=0;
  const { data, error } = await db.from('item_requirements').select('requirement_id').like('requirement_id', prefix+'%').order('requirement_id',{ascending:false}).limit(50);
  if (error) throw error;
  (data||[]).forEach(r=>{ const m=/^(\d{6})(\d{4})$/.exec(String(r.requirement_id||'')); if(m && m[1]===prefix) seq=Math.max(seq,parseInt(m[2],10)); });
  return prefix + String(seq+1).padStart(4,'0');
}
const reqIsMissingCol = e => e && (e.code==='PGRST204' || e.code==='42703' || /could not find the .* column|column .* does not exist/i.test(e.message||''));
async function reqInsertOne(p){
  /* item_code / uom are stored when the table has those columns; otherwise UoM is appended to the description */
  const strip = o => { const c={...o}; delete c.uom; delete c.item_code; c.description=((o.description||'')+' [UoM: '+o.uom+']').trim(); return c; };
  let res = await db.from('item_requirements').insert(REQ_EXTRA_COLS===false?strip(p):p).select().single();
  if (res.error && REQ_EXTRA_COLS!==false && reqIsMissingCol(res.error)){
    REQ_EXTRA_COLS=false;
    res = await db.from('item_requirements').insert(strip(p)).select().single();
  } else if (!res.error && REQ_EXTRA_COLS===null) REQ_EXTRA_COLS=true;
  return res;
}
function reqSameVehicle(m,v){
  return !!m && (String(m.vehicle_id)===String(v.id) || (m.registration_number && m.registration_number===reqVehCode(v)) || m.vehicle_name===v.vehicle_name);
}
/* The vehicle list comes from vehicle_master, whose ids are not UUIDs, so item_requirements.vehicle_id / item_id
   cannot hold them (they are saved by name + code instead). If those columns are still NOT NULL, show the one-time fix. */
function reqShowDbFix(col){
  const sql = col==='requirement_trigger' ? 'select t.tgname, pg_get_functiondef(t.tgfoid) as definition from pg_trigger t where t.tgrelid = \'public.item_requirements\'::regclass and not t.tgisinternal;  -- copy the result and send it to Claude' : col==='requirement_id' ? 'alter table public.item_requirements drop constraint if exists item_requirements_requirement_id_key;' : 'alter table public.item_requirements alter column vehicle_id drop not null, alter column item_id drop not null;';
  const old=document.getElementById('reqDbFix'); if(old) old.remove();
  const host=document.getElementById('r_summary'); if(!host) { toast('Database setting needed: '+sql,'error'); return; }
  host.insertAdjacentHTML('afterend',`<div id="reqDbFix" class="mt-2 p-3 rounded-lg bg-red-50 border border-red-200 text-xs text-red-800">
    <b>${col==='requirement_trigger'?'Saved with the old number — one-time database fix needed.':'Nothing was saved — one-time database fix needed.'}</b> ${col==='requirement_trigger'?'The database is overwriting the request number with its own (old REQ-…) numbering through a trigger.':col==='requirement_id'?'The request number is now shared by all records of one submission, but the table still requires <code>requirement_id</code> to be unique.':'The table still requires <code>'+escapeHtml(col)+'</code>, but vehicles/items here are saved by name and code.'}
    ${col==='requirement_trigger'?'This submission was saved with the old number, so do not submit it again. Run this in the Supabase SQL editor and send the result:':'Run this once in the Supabase SQL editor, then press Submit again (existing data is not affected):'}
    <pre class="mt-1.5 p-2 bg-white border border-red-200 rounded overflow-x-auto whitespace-pre-wrap select-all">${escapeHtml(sql)}</pre>
    <button type="button" class="mt-1 text-teal-700 font-medium hover:underline" onclick="navigator.clipboard&&navigator.clipboard.writeText(this.previousElementSibling.textContent).then(()=>toast('SQL copied','success'))">Copy SQL</button></div>`);
  const b=document.getElementById('reqDbFix'); if(b) b.scrollIntoView({block:'center',behavior:'smooth'});
}
async function saveReq(){
  if (!REQ) return;
  const vehs=[...REQ.vSel.values()];
  if (!vehs.length){ toast('Select at least one vehicle.','error'); const el=document.getElementById('r_vsearch'); if(el) el.focus(); return; }
  const seen=new Set();
  for (let n=0;n<REQ.rows.length;n++){
    const r=REQ.rows[n];
    const bad=(msg,fid)=>{ toast(`Item ${n+1}: ${msg}`,'error');
      const card=document.querySelector(`[data-card="${r.uid}"]`);
      if(card){ card.classList.add('ring-2','ring-red-400'); card.scrollIntoView({block:'center',behavior:'smooth'}); setTimeout(()=>card.classList.remove('ring-2','ring-red-400'),2500); }
      const f=document.getElementById(fid+r.uid); if(f) f.focus(); };
    if (!r.item){ bad('select an item from the search results.','ri_q_'); return; }
    if (!(parseFloat(r.qty)>0)){ bad('enter a valid quantity.','ri_qty_'); return; }
    if (!r.uom){ bad('select a UoM.','ri_uom_'); return; }
    const key=String(r.item.id);
    if (seen.has(key)){ bad('this item is added more than once.','ri_q_'); return; }
    seen.add(key);
  }
  const need=document.getElementById('r_need').value;
  if (!need){ toast('Enter need by date.','error'); return; }
  const maintId=document.getElementById('r_maint').value || null;
  const maintRec=maintId ? REQ.maint.find(m=>String(m.id)===String(maintId)) : null;
  const pr=document.getElementById('r_pr').value.trim()||null;
  const desc=document.getElementById('r_desc').value.trim();
  const remarks=document.getElementById('r_remarks').value.trim();
  let submissionId;
  try{ submissionId = await reqNextSubmissionId(); }catch(e){ toast('Could not generate the request number: '+(e.message||e),'error'); return; }
  const payloads=[];
  vehs.forEach(v=>{
    const link = maintId && (vehs.length===1 || reqSameVehicle(maintRec,v)) ? maintId : null;  // with several vehicles, link only the maintenance record's own vehicle
    REQ.rows.forEach(r=>payloads.push({
      requirement_id: submissionId,
      /* numeric ids from the master tables cannot go into uuid columns (the "invalid input syntax for type uuid" error);
         the vehicle / item are still stored by name, code and registration number */
      vehicle_id: reqIsUuid(v.id)?v.id:null,
      vehicle_name: v.vehicle_name,
      registration_number: reqVehCode(v),
      item_id: reqIsUuid(r.item.id)?r.item.id:null,
      item_name: r.item.item_name,
      item_code: r.item.item_code||null,
      required_quantity: parseFloat(r.qty),
      uom: r.uom,
      need_by_date: need,
      pr_number: pr,
      description: desc,
      remarks,
      submitted_by: currentUser.id,
      maintenance_id: link,
      status: 'Submitted to ROM'
    }));
  });
  const btn=document.getElementById('reqSubmitBtn'); if(btn){ btn.disabled=true; btn.textContent='Submitting…'; }
  const created=[];
  try{
    for (const p of payloads){
      const { data, error } = await reqInsertOne(p);
      if (error) throw error;
      created.push(data);
    }
  }catch(error){
    let msg=error.message||'Could not save the requirement.';
    if (created.length){   // all-or-nothing: undo what was already saved in this submission
      const { data:del, error:de } = await db.from('item_requirements').delete().in('id', created.map(c=>c.id)).select('id');
      msg += (de || !del || del.length!==created.length) ? ` (${created.length} record(s) were saved before the error — please check the list.)` : ' Nothing was saved.';
    }
    if (btn){ btn.disabled=false; btn.textContent='Submit'; }
    const nn = /null value in column "(vehicle_id|item_id)"/i.exec(error.message||'');
    if (error.code==='23505' || /duplicate key|unique/i.test(error.message||'')){ reqShowDbFix('requirement_id'); return; }
    if (error.code==='23502' || nn){ reqShowDbFix(nn?nn[1]:'vehicle_id'); return; }
    toast(msg,'error'); return;
  }
  /* If the database (a trigger / default) replaced the number with its own REQ-xxxx, write ours back. */
  if (created.some(c=>c.requirement_id!==submissionId)){
    const { data:fixed, error:fe } = await db.from('item_requirements').update({requirement_id: submissionId}).in('id', created.map(c=>c.id)).select('id, requirement_id');
    if (!fe && fixed && fixed.length===created.length){ created.forEach(c=>{ c.requirement_id=submissionId; }); }
    else { console.error('Could not set request number', fe, fixed); reqShowDbFix('requirement_trigger'); }
  }
  const linked=created.find(c=>c.maintenance_id);
  if (linked) await db.from('maintenance_records').update({status:'Item Requirement Pending', item_requirement_id: linked.id}).eq('id', linked.maintenance_id);
  await Promise.all(created.map(c=>logActivity('CREATE_ITEM_REQUIREMENT','item_requirements', c.id, `${c.requirement_id} - ${c.item_name} x${c.required_quantity}${c.uom?' '+c.uom:''}`)));
  const recs = created.map((c,i)=>({...payloads[i], ...c, uom: c.uom||payloads[i].uom, item_code: c.item_code||payloads[i].item_code}));
  let pdfOk=false;
  try{ pdfOk = reqMakeReceipt(recs, {submitter: currentUser, maint: maintRec ? `${maintRec.vehicle_name} - ${maintRec.maintenance_item}` : null}); }catch(e){ console.error('Receipt error',e); }
  const base = created.length===1 ? `Submitted: ${created[0].requirement_id}` : `Submitted request ${created[0].requirement_id} (${created.length} records)`;
  if (created[0].requirement_id!==submissionId) console.warn('Database replaced the request number', submissionId, '->', created[0].requirement_id);
  toast(base + (pdfOk ? '. PDF receipt downloaded.' : '. (Receipt not generated - use the receipt icon in the list.)'),'success');
  reqAfterSave();
}

async function saveSCSchedule(reqRowId){
  const exp = document.getElementById('sc_exp').value || null;
  const qty = document.getElementById('sc_qty').value;
  const status = document.getElementById('sc_status').value;
  const rem = document.getElementById('sc_remarks').value.trim();
  if (!status){ toast('Select status.','error'); return; }
  const { data: r } = await db.from('item_requirements').select('*').eq('id', reqRowId).maybeSingle();
  if (!r){ toast('Requirement missing.','error'); return; }
  // upsert schedule
  const { data: existing } = await db.from('supply_chain_schedules').select('*').eq('requirement_id', reqRowId).maybeSingle();
  const payload = {
    requirement_id: reqRowId,
    requirement_code: r.requirement_id,
    expected_delivery_date: exp,
    confirmed_delivery_qty: qty?parseFloat(qty):null,
    delivery_status: status,
    remarks: rem,
    scheduled_by: currentUser.id,
  };
  let res;
  if (existing){
    res = await db.from('supply_chain_schedules').update(payload).eq('id', existing.id);
  } else {
    res = await db.from('supply_chain_schedules').insert(payload);
  }
  if (res.error){ toast(res.error.message,'error'); return; }
  // update requirement status
  let newStatus = 'Submitted to Supply Chain';
  if (status==='Delivered') newStatus='Delivered';
  else if (status!=='Awaiting Scheduling') newStatus='Scheduled';
  await db.from('item_requirements').update({status: newStatus}).eq('id', reqRowId);
  // update maintenance record if linked
  if (r.maintenance_id){
    const newMaintStatus = status==='Delivered'?'Repair In Progress': (status!=='Awaiting Scheduling'?'Waiting for Item Delivery':null);
    if (newMaintStatus) await db.from('maintenance_records').update({status: newMaintStatus}).eq('id', r.maintenance_id);
  }
  await logActivity('SUPPLY_CHAIN_SCHEDULE','supply_chain_schedules', reqRowId, `${r.requirement_id} → ${status}`);
  toast('Schedule saved','success'); closeModal(); refreshSC();
}

async function imCreate(){
  const er = document.getElementById('imErr'); er.textContent='';
  const name = document.getElementById('im_name').value.trim(), code = document.getElementById('im_code').value.trim();
  if (!name) { er.textContent='Enter an item name.'; return; }
  if (!code) { er.textContent='Enter an item code.'; return; }
  const btn = document.getElementById('imSave'); btn.disabled = true;
  const existing = await loadItems();
  if (existing.some(x=>String(x.item_code).toLowerCase()===code.toLowerCase())){ btn.disabled=false; er.textContent='This item code is already registered.'; return; }
  const { error } = await db.from('items').insert({
    item_name:name, item_code:code,
    item_category:document.getElementById('im_cat').value.trim()||null,
    unit:document.getElementById('im_unit').value,
    description:document.getElementById('im_desc').value.trim(),
    status:document.getElementById('im_status').value });
  btn.disabled = false;
  if (error){ er.textContent = error.code==='23505' ? 'This item code is already registered.' : error.message; return; }
  try{ await logActivity('ITEM_CREATE','items',null,code); }catch(e){}

function imSetFile(f){

  document.getElementById('imDropS').textContent = f ? 'Ready to import - click to change' : 'or click to browse';
  document.getElementById('imRep').innerHTML = '';
}
function imTemplate(){
  const blob = new Blob([IM_HEADER.join(',')+'\r\nOil Filter,OF-1001,Filters,PCS,Engine oil filter,Active\r\nHydraulic Oil,HO-2001,Lubricants,LTR,ISO 68,Active\r\n'],{type:'text/csv'});

function imReport(ok, msg, list){
  document.getElementById('imRep').innerHTML = `<div class="mt-3 rounded-lg p-3 text-sm ${ok?'bg-green-50 text-green-800':'bg-red-50 text-red-800'}"><b>${escapeHtml(msg)}</b>

async function imImport(){
  if (!imCsvFile){ toast('Choose a CSV file first','error'); return; }
  const rows = fqParseCsv(await imCsvFile.text());
  if (!rows.length){ imReport(false,'The file is empty.'); return; }
  const h = rows[0].map(x=>x.trim().toLowerCase());
  if (h.length!==IM_HEADER.length || IM_HEADER.some((c,k)=>h[k]!==c)){ imReport(false,'Header must be exactly: '+IM_HEADER.join(',')); return; }
  const existing = await loadItems();
  const seen = new Set(existing.map(x=>String(x.item_code).toLowerCase())), good=[], problems=[];
  rows.slice(1).forEach((r,i)=>{ const ln=i+2, c=k=>(r[k]||'').trim();
    const name=c(0), code=c(1), unit=c(3).toUpperCase(), status=c(5)||'Active';
    if(!name) return problems.push(`Line ${ln}: missing item_name`);
    if(!code) return problems.push(`Line ${ln}: missing item_code`);
    if(!IM_UNITS.includes(unit)) return problems.push(`Line ${ln}: invalid unit "${c(3)}"`);
    if(!['Active','Inactive'].includes(status)) return problems.push(`Line ${ln}: status must be Active or Inactive`);
    if(seen.has(code.toLowerCase())) return problems.push(`Line ${ln}: code ${code} already exists or is repeated`);
    seen.add(code.toLowerCase());
    good.push({item_name:name, item_code:code, item_category:c(2)||null, unit, description:c(4), status}); });
  if (!good.length){ imReport(false,'Nothing imported.',problems); return; }
  const btn = document.getElementById('imImp'); btn.disabled = true;
  for (let i=0;i<good.length;i+=500){
    const { error } = await db.from('items').insert(good.slice(i,i+500));
    if (error){ btn.disabled=false; imReport(false,'Import stopped: '+error.message,problems); return; }
  }
  btn.disabled = false;
  try{ await logActivity('ITEM_IMPORT','items',null,`${good.length} items`); }catch(e){}
  imSetFile(null); await refreshItemsMaster();
  imReport(true, `Imported ${good.length} item${good.length>1?'s':''}${problems.length?`, skipped ${problems.length}`:''}.`, problems);
  toast(`Imported ${good.length} items`,'success');
}

  const cats = [...new Set(imAll.map(i=>(i.item_category||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})), hasNone = imAll.some(i=>!(i.item_category||'').trim());
  if (imFCat && imFCat!=='__none' && !cats.includes(imFCat)) imFCat='';

function imFiltered(){
  const q=imFQ.trim().toLowerCase();
  return imAll.filter(i=>{ const c=(i.item_category||'').trim();
    if (imFCat && !(imFCat==='__none' ? c==='' : c===imFCat)) return false;
    return !q || [i.item_name,i.item_code,c,i.unit,i.description,i.status].some(v=>String(v??'').toLowerCase().includes(q)); });
}
function imRender(){
  const tb=document.querySelector('#iWrap tbody'), cnt=document.getElementById('im_cnt'), pg=document.getElementById('im_pager'); if(!tb) return;
  const filtering=!!(imFCat||imFQ.trim()), total=imAll.length; let list, from=0;
  if (filtering){ list=imFiltered(); }
  else { const pages=Math.max(1,Math.ceil(total/IM_PAGE)); imPg=Math.max(0,Math.min(imPg,pages-1)); from=imPg*IM_PAGE; list=imAll.slice(from,from+IM_PAGE); }
  tb.innerHTML = list.map(imRow).join('') || emptyRow(8, filtering?'No items match the filters.':'No items.');
  if (cnt) cnt.textContent = filtering ? `${list.length} of ${total} items` : `${total} items`;
  if (pg) pg.innerHTML = filtering ? `<span class="text-slate-500">Showing all ${list.length} matching item${list.length===1?'':'s'}</span><span></span>`
    : `<button onclick="imGo(-1)" ${imPg===0?'disabled':''} class="border border-slate-300 rounded-lg px-3 py-1.5 disabled:opacity-50">Previous</button><span class="text-slate-500">${total?from+1:0}–${from+list.length} of ${total}</span><button onclick="imGo(1)" ${from+list.length>=total?'disabled':''} class="border border-slate-300 rounded-lg px-3 py-1.5 disabled:opacity-50">Next</button>`;
  lucide.createIcons();   // draw the Edit/Delete icons in the freshly rendered rows
}
function imGo(d){ imPg+=d; imRender(); }
function filterIMTable(){

async function saveItem(id){
  const name = document.getElementById('i_name').value.trim();
  const code = document.getElementById('i_code').value.trim();
  if (!name||!code){ toast('Name & code required.','error'); return; }
  const payload = {
    item_name:name, item_code:code,
    item_category:document.getElementById('i_cat').value.trim()||null,
    unit:document.getElementById('i_unit').value,
    description:document.getElementById('i_desc').value.trim(),
    status:document.getElementById('i_status').value,
  };
  let res;
  if (id) res=await db.from('items').update(payload).eq('id',id);

}

let LAST_REPORT = {headers:[], rows:[]};
async function generateReport(){
  const type = document.getElementById('rep_type').value;
  const from = document.getElementById('rep_from').value;
  const to   = document.getElementById('rep_to').value;
  const out = document.getElementById('repOut');
  out.innerHTML = `<div class="text-sm text-slate-400">Loading…</div>`;

  let headers=[], rows=[];
  if (type==='maint' || type==='history'){
    let q = db.from('maintenance_records').select('*').order('created_at',{ascending:false});
    if (from) q = q.gte('maintenance_required_date', from);
    if (to)   q = q.lte('maintenance_required_date', to);
    const { data } = await q;
    headers = ['Vehicle','Reg No.','Item','Required Date','Planned Repair','Status','Remarks'];
    rows = (data||[]).map(r=>[r.vehicle_name, r.registration_number, r.maintenance_item, fmtDate(r.maintenance_required_date), fmtDate(r.planned_repair_date), r.status, r.remarks||'']);
  } else if (type==='pending'){
    const { data } = await db.from('maintenance_records').select('*').neq('status','Completed').order('updated_at',{ascending:false});
    headers = ['Vehicle','Reg No.','Item','Status','Last Updated'];
    rows = (data||[]).map(r=>[r.vehicle_name, r.registration_number, r.maintenance_item, r.status, fmtDateTime(r.updated_at)]);
  } else if (type==='req'){
    let q = db.from('item_requirements').select('*').order('submission_date',{ascending:false});
    if (from) q = q.gte('submission_date', from);
    if (to)   q = q.lte('submission_date', to);
    const { data } = await q;
    headers = ['Req ID','Vehicle','Item','Qty','Need By','PR No.','Status'];
    rows = (data||[]).map(r=>[r.requirement_id, r.vehicle_name, r.item_name, r.required_quantity, fmtDate(r.need_by_date), r.pr_number||'', r.status]);
  } else if (type==='rom'){
    const { data } = await db.from('rom_reviews').select('*, item_requirements!inner(*)').order('reviewed_at',{ascending:false});
    headers = ['Req ID','Vehicle','Item','Required','Proposed','Remarks','Reviewed At'];
    rows = (data||[]).map(x=>[x.requirement_code, x.item_requirements?.vehicle_name||'', x.item_requirements?.item_name||'', x.required_quantity, x.proposed_quantity, x.remarks||'', fmtDateTime(x.reviewed_at)]);
  } else if (type==='sc' || type==='delayed'){
    let q = db.from('supply_chain_schedules').select('*, item_requirements!inner(*)').order('updated_at',{ascending:false});
    const { data } = await q;
    let arr = data||[];
    if (type==='delayed'){
      const today = new Date(); today.setHours(0,0,0,0);
      arr = arr.filter(s=>s.expected_delivery_date && new Date(s.expected_delivery_date)<today && s.delivery_status!=='Delivered');
    }
    headers = ['Req ID','Vehicle','Item','Expected Delivery','Confirmed Qty','Status','Remarks'];
    rows = arr.map(x=>[x.requirement_code, x.item_requirements?.vehicle_name||'', x.item_requirements?.item_name||'', fmtDate(x.expected_delivery_date), x.confirmed_delivery_qty||'', x.delivery_status, x.remarks||'']);
  }
  LAST_REPORT = {headers, rows};
  const thead = headers.map(h=>`<th class="px-4 py-2 text-left">${escapeHtml(h)}</th>`).join('');
  const tbody = rows.length ? rows.map(r=>`<tr>${r.map(c=>`<td class="px-4 py-2">${escapeHtml(String(c))}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${headers.length}" class="px-4 py-6 text-center text-slate-400">No data</td></tr>`;
  out.innerHTML = tableCard(`Report: ${document.getElementById('rep_type').selectedOptions[0].text} (${rows.length} rows)`, headers, tbody);
}
function exportCSV(){
  if (!LAST_REPORT.headers.length){ toast('Generate a report first.','error'); return; }
  const csv = [LAST_REPORT.headers, ...LAST_REPORT.rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='report.csv'; a.click();
  URL.revokeObjectURL(url);
  toast('CSV exported','success');
}

async function saveUser(id){
  const name = document.getElementById('u_name').value.trim();
  const email = document.getElementById('u_email').value.trim();
  const dept = document.getElementById('u_dept').value;
  const role = document.getElementById('u_role').value;
  const status = document.getElementById('u_status').value;
  const perms = {};
  const pgChecked = n => { const el=document.getElementById('pgp_'+n); return !!(el && el.checked); };
  // legacy dash_* keys stay in sync: a key is on when at least one page using it is on
  const keys = [...new Set(Object.values(PAGES).filter(p=>!p.superOnly).map(p=>p.key))];
  keys.forEach(k=>{ perms[k] = Object.keys(PAGES).some(n=>PAGES[n].key===k && !PAGES[n].superOnly && pgChecked(n)); });
  if (pgReady()) PG_SHARED.forEach(n=>{ perms['pg_'+n] = pgChecked(n); });

  if (!id){
    if (!name||!email){ toast('Name & email required.','error'); return; }
    const pass = document.getElementById('u_pass').value;
    if (!pass || pass.length<6){ toast('Password min 6 chars.','error'); return; }
    // check email not already used
    const { data: existing } = await db.from('user_credentials').select('id').eq('email', email).maybeSingle();
    if (existing){ toast('Email already registered.','error'); return; }
    // 1) create profile
    const { data: prof, error: pe } = await db.from('profiles').insert({
      full_name: name, email, department: dept, role, account_status: status
    }).select().single();
    if (pe){ toast(pe.message,'error'); return; }
    // 2) create credentials with hashed password
    const salt = randomSalt();
    const hash = await sha256Hex(salt + pass);
    const { error: ce } = await db.from('user_credentials').insert({
      email, password_hash: hash, salt, profile_id: prof.id, status
    });
    if (ce){
      // rollback profile
      await db.from('profiles').delete().eq('id', prof.id);
      toast(ce.message,'error'); return;
    }
    // 3) permissions
    await db.from('user_permissions').upsert({ user_id: prof.id, ...perms }, { onConflict: 'user_id' });
    await logActivity('CREATE_USER','profiles', prof.id, `${email} (${dept}/${role})`);
    toast('User created','success'); closeModal(); refreshUA();
  } else {
    const { data: existing } = await db.from('profiles').select('*').eq('id', id).maybeSingle();
    if (!existing){ toast('User missing.','error'); return; }
    if (existing.role==='Super Admin' && role!=='Super Admin'){ toast('Cannot demote Super Admin.','error'); return; }
    const { error: e1 } = await db.from('profiles').update({
      full_name: name, department: dept, role, account_status: status
    }).eq('id', id);
    if (e1){ toast(e1.message,'error'); return; }
    const { error: e2 } = await db.from('user_permissions').upsert({ user_id: id, ...perms }, { onConflict: 'user_id' });
    if (e2){ toast(e2.message,'error'); return; }
    await logActivity('UPDATE_USER','profiles', id, `Updated ${email}`);
    toast('Saved','success'); closeModal(); refreshUA();
  }
}

async function toggleDisable(id, current){
  const { data: p } = await db.from('profiles').select('*').eq('id', id).maybeSingle();
  if (!p) return;
  if (p.role==='Super Admin'){ toast('Cannot disable Super Admin.','error'); return; }
  const newStatus = current==='Active'?'Disabled':'Active';
  const { error } = await db.from('profiles').update({account_status:newStatus}).eq('id', id);
  if (error){ toast(error.message,'error'); return; }
  // also flip credentials status so they can't log in
  await db.from('user_credentials').update({status:newStatus}).eq('email', p.email);
  await logActivity('TOGGLE_USER','profiles', id, `${p.email} → ${newStatus}`);
  toast(`User ${newStatus}`,'success'); refreshUA();
}
async function deleteUser(id, email){
  if (email==='admin@gmail.com'){ toast('Cannot delete Super Admin.','error'); return; }
  if (!await confirmDialog(`${email} will be removed along with their profile, credentials and permissions.`, {title:'Delete user?', confirmText:'Delete', danger:true})) return;
  // cascade: user_credentials + user_permissions removed via FK on delete cascade
  const { error } = await db.from('profiles').delete().eq('id', id);
  if (error){ toast(error.message,'error'); return; }
  await logActivity('DELETE_USER','profiles', id, email);
  toast('User deleted.','success'); refreshUA();
}
async function resetPassword(email){
  const newPass = await promptDialog(`Enter a new temporary password for ${email}.`, {title:'Reset password', confirmText:'Reset', placeholder:'At least 6 characters'});
  if (!newPass){ return; }
  if (newPass.length < 6){ toast('Password must be at least 6 characters.','error'); return; }
  const salt = randomSalt();
  const hash = await sha256Hex(salt + newPass);
  const { error } = await db.from('user_credentials')
    .update({ password_hash: hash, salt, updated_at: new Date().toISOString() })
    .eq('email', email);
  if (error){ toast(error.message,'error'); return; }
  await logActivity('RESET_PASSWORD','user_credentials', null, `Reset password for ${email}`);
  toast(`Password reset. New password: ${newPass}`,'success');
}

/* Vehicle list for all entry / history / maintenance pages: oil project's `master` table (oilDb): entry, history, calendar, overrides. */
async function fqLoadVehicles(){
  let all=[], from=0;
  for(;;){
    const { data, error } = await oilDb.from('master').select('code, vehicle_name').order('code').range(from,from+999);
    if (error){ toast('Could not load vehicles: '+error.message,'error'); throw error; }
    all=all.concat(data||[]); if(!data||data.length<1000) break; from+=1000;
  }
  fqVehicles = all.filter(v=>v.code).map(v=>({id:String(v.code), code:String(v.code), vehicle_name:String(v.vehicle_name||v.code)}))
    .sort((a,b)=>a.vehicle_name.localeCompare(b.vehicle_name,undefined,{numeric:true}));
}

async function fqLoadVehiclesLegacy(){
  const { data, error } = await db.from('vehicle_master').select('*').order('vehicle_name');
  if (error) throw error;
  fqVehicles = data || [];
}
function fqMatch(v,q){
  q = fqNorm(q); if(!q) return true;
  const name = fqNorm(v.vehicle_name), code = v.code.toLowerCase();
  return name.includes(q) || code.includes(q);
}

/* QR modules come from the same local qrcodejs library / same data (the vehicle code) / same level M as the existing QR modal. */
function fqQrMatrix(text){
  const d = document.createElement('div');
  const q = new QRCode(d, {text:text, width:128, height:128, correctLevel:QRCode.CorrectLevel.M});
  const m = q._oQRCode, n = m.getModuleCount(), rows = [];
  for (let r=0;r<n;r++){ const row=[]; for (let c=0;c<n;c++) row.push(m.isDark(r,c)); rows.push(row); }
  return rows;
}
function fqFit(doc, text, max, min, w){
  let fs = max;
  for (; fs>min; fs-=0.25){ doc.setFontSize(fs); if (doc.getTextWidth(text)<=w) return {fs, ok:true}; }
  doc.setFontSize(min); return {fs:min, ok: doc.getTextWidth(text)<=w};
}
function fqSplit2(doc, text, w){           // best two-line split at a space or hyphen
  let best=null;
  for (let i=1;i<text.length;i++){
    if (!(text[i-1]===' ' || text[i-1]==='-')) continue;
    const a=text.slice(0,i).trim(), b=text.slice(i).trim(); if(!a||!b) continue;
    const wa=fqFit(doc,a,13,4,w), wb=fqFit(doc,b,13,4,w), fs=Math.min(wa.fs,wb.fs);
    if (!best || fs>best.fs) best={lines:[a,b], fs};
  }
  return best;
}
function fqDrawCard(doc, x, y, v){
  const {W,H,QS,M} = FQ_CARD, MM = 0.3528;
  doc.setDrawColor(0); doc.setFillColor(0); doc.setTextColor(0);
  // outer border (kept fully inside the 85 x 55 mm card box)
  doc.setLineWidth(0.6); doc.rect(x+0.3, y+0.3, W-0.6, H-0.6, 'S');
  // QR box: exactly 52 x 52 mm, right side
  const qx = x+W-M-QS, qy = y+M;
  const mat = fqQrMatrix(String(v.code)), n = mat.length, QZ = 1, inner = QS, cell = inner/(n+2*QZ);
  const ox = qx+QZ*cell, oy = qy+QZ*cell;
  for (let r=0;r<n;r++){
    let c=0;
    while (c<n){
      if (!mat[r][c]) { c++; continue; }
      let e=c; while (e<n && mat[r][e]) e++;
      doc.rect(ox+c*cell, oy+r*cell, (e-c)*cell+0.01, cell+0.01, 'F');
      c=e;
    }
  }
  // left section
  const lx = x+2.2, lw = qx-1.5-lx, cx = lx+lw/2;
  doc.setFillColor(0); doc.rect(lx, y+3, lw, 7, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(255);
  const tw = doc.getTextWidth('FOL ID'); doc.text('FOL ID', cx, y+3+3.5+10*MM*0.35, {align:'center'});
  doc.setDrawColor(255); doc.setLineWidth(0.4);
  const side = (lw-tw)/2 - 1.2 - 1.5;
  if (side>1){ const ly=y+6.5;
    doc.line(lx+1.5, ly, lx+1.5+side, ly);
    doc.line(lx+lw-1.5-side, ly, lx+lw-1.5, ly); }
  // name + code, centred in the remaining left area
  doc.setTextColor(0); doc.setFont('helvetica','bold');
  const name = String(v.vehicle_name||''), code = String(v.code||''), tw2 = lw-1;
  let lines=[name], nfs, r1 = fqFit(doc,name,13,7.5,tw2);
  if (r1.ok) nfs=r1.fs;
  else { const sp = fqSplit2(doc,name,tw2); if (sp){ lines=sp.lines; nfs=sp.fs; } else { nfs=4.5; doc.setFontSize(nfs); lines=doc.splitTextToSize(name,tw2).slice(0,3); } }
  const cfs = fqFit(doc,code,12,5,tw2).fs, gap = 3;
  const lh = f=>f*MM*1.15;
  const total = lines.length*lh(nfs) + gap + lh(cfs);
  const top = y+12, areaH = (y+H-9)-top;
  let cy = top + Math.max(0,(areaH-total)/2);
  doc.setFontSize(nfs);
  lines.forEach(t=>{ doc.text(t, cx, cy+nfs*MM*0.85, {align:'center'}); cy+=lh(nfs); });
  cy += gap; doc.setFontSize(cfs); doc.text(code, cx, cy+cfs*MM*0.85, {align:'center'});
  const co = fqFit(doc,'X Ceramics Group',7,4,lw); doc.setFontSize(co.fs); doc.text('X Ceramics Group', cx, y+H-3.2, {align:'center'});
}
async function fqGenPdf(){
  const list = fqVehicles.filter(v=>fqSel.has(v.code));
  if (!list.length){ toast('Select at least one vehicle first.','error'); return; }
  const J = window.jspdf && window.jspdf.jsPDF;
  if (!J || typeof QRCode==='undefined'){ toast('PDF/QR library could not load. Check your internet connection.','error'); return; }
  try{
    const {W,H,GX,GY,COLS,ROWS} = FQ_CARD, per = COLS*ROWS;
    const doc = new J({orientation:'portrait', unit:'mm', format:'a4', compress:true});
    const x0 = (210-(COLS*W+(COLS-1)*GX))/2, y0 = (297-(ROWS*H+(ROWS-1)*GY))/2;
    list.forEach((v,i)=>{
      if (i>0 && i%per===0) doc.addPage('a4','portrait');
      const k=i%per, col=k%COLS, row=Math.floor(k/COLS);
      fqDrawCard(doc, x0+col*(W+GX), y0+row*(H+GY), v);
    });
    doc.setProperties({title:'Vehicle Identification Cards'});
    doc.save('Vehicle_Identification_Cards.pdf');
    toast(`PDF generated: ${list.length} card${list.length>1?'s':''}, ${Math.ceil(list.length/per)} page${list.length>per?'s':''}. Print at 100% / Actual size.`,'success');
  }catch(err){ console.error(err); toast('Could not generate the PDF: '+err.message,'error'); }
}

/* ---- CSV import ---- */
function fqSetFile(f){
  fqCsvFile = f || null;
  document.getElementById('fqDropT').textContent = f ? f.name : 'Drag & drop CSV file here';
  document.getElementById('fqDropS').textContent = f ? 'Ready to import - click to change' : 'or click to browse';
  document.getElementById('fqRep').innerHTML = '';
}
function fqDownloadTemplate(){
  const blob = new Blob(['vehicle_name,code\r\nForklift-01,XFL0001O\r\nDump Truck-6986,XDT6986R\r\n'],{type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'vehicle_template.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function fqParseCsv(t){
  t = t.replace(/^\uFEFF/,''); const rows=[]; let row=[], f='', q=false;
  for (let i=0;i<t.length;i++){ const c=t[i];
    if (q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if (c==='"') q=true;
    else if (c===','){ row.push(f); f=''; }
    else if (c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c; }
  if (f!==''||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function fqReport(ok, msg, list){
  document.getElementById('fqRep').innerHTML = `<div class="mt-3 rounded-lg p-3 text-sm ${ok?'bg-green-50 text-green-800':'bg-red-50 text-red-800'}"><b>${escapeHtml(msg)}</b>
    ${list&&list.length?`<ul class="mt-1 ml-4 list-disc max-h-40 overflow-auto">${list.slice(0,50).map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul>${list.length>50?`<div>…and ${list.length-50} more</div>`:''}`:''}</div>`;
}
async function fqImportCsv(){
  if (!fqCsvFile){ toast('Choose a CSV file first','error'); return; }
  const rows = fqParseCsv(await fqCsvFile.text());
  if (!rows.length){ fqReport(false,'The file is empty.'); return; }
  const h = rows[0].map(x=>x.trim().toLowerCase());
  if (h.length!==2 || h[0]!=='vehicle_name' || h[1]!=='code'){ fqReport(false,'Header must be exactly: vehicle_name,code'); return; }
  const seen = new Set(fqVehicles.map(v=>v.code)), good=[], problems=[];
  rows.slice(1).forEach((r,i)=>{ const ln=i+2, name=(r[0]||'').trim(), code=(r[1]||'').trim().toUpperCase();
    if(!name) return problems.push(`Line ${ln}: missing vehicle name`);
    if(!FQ_CODE_RE.test(code)) return problems.push(`Line ${ln}: invalid code "${code}"`);
    if(seen.has(code)) return problems.push(`Line ${ln}: code ${code} already exists or is repeated`);
    seen.add(code); good.push({vehicle_name:name, code}); });
  if (!good.length){ fqReport(false,'Nothing imported.',problems); return; }
  const btn = document.getElementById('fqImp'); btn.disabled = true;
  for (let i=0;i<good.length;i+=500){
    const { error } = await db.from('vehicle_master').insert(good.slice(i,i+500));
    if (error){ btn.disabled=false; fqReport(false,'Import stopped: '+error.message,problems); return; }
  }
  btn.disabled = false;
  try{ await logActivity('FILTER_VEHICLE_IMPORT','vehicle_master',null,`${good.length} vehicles`); }catch(e){}
  fqSetFile(null); await fqRefresh();
  fqReport(true, `Imported ${good.length} vehicle${good.length>1?'s':''}${problems.length?`, skipped ${problems.length}`:''}.`, problems);
  toast(`Imported ${good.length} vehicles`,'success');
}

async function fdFetchAll(){   /* reads the universal table (Filter category); one record = one entry group */
  let all=[], from=0;
  const f=document.getElementById('fd_from').value, t=document.getElementById('fd_to').value;
  for(;;){
    let q = db.from('item_replacement_history').select('entry_group_id,replacement_date,vehicle_code,vehicle_name,meter_reading,item_name,quantity')
      .eq('entry_type','Filter').order('replacement_date',{ascending:false}).order('id',{ascending:true}).range(from,from+999);
    if (f) q=q.gte('replacement_date',f); if (t) q=q.lte('replacement_date',t);
    const { data, error } = await q; if (error) throw error;
    all = all.concat(data); if (data.length<1000) break; from+=1000;
  }
  const g=new Map();
  all.forEach(r=>{ let x=g.get(r.entry_group_id); if(!x){ x={Date:r.replacement_date,code:r.vehicle_code,vehicle_name:r.vehicle_name,Meter_Reading:r.meter_reading,q:{}}; g.set(r.entry_group_id,x); }
    x.q[r.item_name]=(x.q[r.item_name]||0)+Number(r.quantity||0); });

function deMatch(v,q){
  q = fqNorm(q); if(!q) return true;
  const name = fqNorm(v.vehicle_name), code = v.code.toLowerCase();
  if (name.includes(q) || code.includes(q)) return true;
  const m = q.match(/^([a-z]+)(\d+)$/); if(!m) return false;
  const [,L,D] = m, type = code.slice(1,3), digits = code.slice(3,7), nameDigits = (v.vehicle_name.match(/\d+/)||[''])[0];
  const typeOk = type===L || name.startsWith(L) || code.slice(0,3)===L;
  const numOk = digits.includes(D) || String(+digits)===String(+D) || nameDigits.replace(/^0+/,'').startsWith(D) || String(+nameDigits)===String(+D);
  return typeOk && numOk;
}

let deScanner = null, deScanBusy = false;
function deSelectByCode(raw){

async function deStopScan(){
  const sc = deScanner; deScanner = null;
  if (!sc) return;
  try{ if (sc.isScanning) await sc.stop(); }catch(e){}
  try{ sc.clear(); }catch(e){}
}
function deOpenScanner(){
  if (typeof Html5Qrcode === 'undefined'){ toast('QR scanner could not load. Check your internet connection.','error'); return; }
  openModal('Scan vehicle QR code', `
    <div id="de_reader" class="w-full rounded-xl overflow-hidden bg-slate-900 min-h-[260px]"></div>
    <p id="de_scanMsg" class="text-sm text-slate-500 mt-3 text-center">Point the camera at the vehicle's QR code.</p>
    <div class="text-center mt-3">
      <label class="inline-flex items-center gap-2 text-sm text-teal-700 cursor-pointer hover:underline">
        <i data-lucide="image" class="w-4 h-4"></i> Upload a QR image instead
        <input type="file" id="de_qrfile" accept="image/*" class="hidden"/></label>
    </div>`,
    `<button onclick="closeModal()" class="px-3 py-1.5 text-sm border border-slate-300 rounded-lg">Cancel</button>`);
  const msg = t=>{ const m=document.getElementById('de_scanMsg'); if(m) m.textContent=t; };
  const sc = new Html5Qrcode('de_reader'); deScanner = sc; deScanBusy = false;
  const onHit = async text=>{
    if (deScanBusy) return; deScanBusy = true;
    if (deSelectByCode(text)){ await deStopScan(); closeModal(); }
    else setTimeout(()=>{ deScanBusy=false; }, 1500);
  };
  sc.start({facingMode:'environment'}, {fps:10, qrbox:{width:230,height:230}}, onHit, ()=>{})
    .catch(err=>{
      const txt = String(err||'');
      msg(/Permission|NotAllowed/i.test(txt) ? 'Camera access was blocked. Allow the camera in your browser, or upload a QR image.'
        : window.isSecureContext ? 'Could not start the camera. You can upload a QR image instead.'
        : 'The camera needs a secure (https) page. You can upload a QR image instead.');
    });
  document.getElementById('de_qrfile').addEventListener('change', async e=>{
    const file = e.target.files[0]; if (!file) return;
    try{
      if (sc.isScanning) await sc.stop();
      const text = await sc.scanFile(file, false);
      if (deSelectByCode(text)){ await deStopScan(); closeModal(); }
    }catch(err){ msg('No QR code found in that image. Try another one.'); }
    e.target.value='';
  });
  lucide.createIcons();
}

async function oeSave(){
  if(oeBusy) return;
  const er=document.getElementById('oe_err'); er.textContent='';
  const fail=m=>{ er.textContent=m; };
  const mr=document.getElementById('oe_meter').value.trim(), m=parseFloat(mr);
  if(!oeSel || !oeVehicles.some(v=>v.code===oeSel.code)) return fail('Select a vehicle from the list.');
  for(let i=0;i<OE_OILS.length;i++){
    const oth=document.getElementById('oe_o'+i);
    if(!oth.classList.contains('hidden') && !(oeQty[i]>0)) return fail('Enter a quantity greater than zero for: '+OE_OILS[i][0]+' (or select 0).');
  }
  const used=OE_OILS.map((o,i)=>({o,q:oeQty[i]})).filter(x=>x.q>0);
  if(!used.length) return fail('Enter a quantity for at least one oil type.');
  if(!oePurpose) return fail('Select a purpose.');
  if(mr===''||isNaN(m)||m<0) return fail('Enter a valid meter reading (0 or more).');
  oeBusy=true;
  const b=document.getElementById('oe_save'); b.disabled=true; b.textContent='Saving…';
  const now=new Date().toISOString(), rm=document.getElementById('oe_rem').value.trim()||null;
  const rows=used.map(x=>({code:oeSel.code,vehicle_name:oeSel.vehicle_name,oil_type:x.o[0],quantity:x.q,unit:x.o[1],purpose:oePurpose,meter_reading:m,remarks:rm,operator_name:(currentUser&&currentUser.full_name)||null,company:'Automobile',entry_datetime:now}));
  const { error } = await oilDb.from('oil_entries').insert(rows);
  oeBusy=false; b.disabled=false; b.innerHTML='&#10003; Save Oil Entry';
  if(error){ fail('Not saved: '+error.message); toast('Oil entry not saved','error'); return; }
  try{ await logActivity('OIL_ENTRY_CREATE','oil_entries',null,`${oeSel.vehicle_name} (${oeSel.code})`); }catch(e){}
  toast('Oil entry saved for '+oeSel.vehicle_name,'success');
  oeSel=null; oePurpose=null; oeQty=OE_OILS.map(()=>0);
  oeShowSel(); oeResetRes(); oeBuildOils();
  document.querySelectorAll('#oe_purp button').forEach(x=>x.className='oe-p py-3 px-2 rounded-lg text-sm font-bold border-2 bg-slate-100 text-slate-500 border-transparent');
  document.getElementById('oe_meter').value='0'; document.getElementById('oe_rem').value='';
}

async function oeLoadHistory(){
  const out=document.getElementById('oh_out'); if(!out) return;
  let q=oilDb.from('oil_entries').select('*',{count:'exact'}).order('entry_datetime',{ascending:false});
  const s=document.getElementById('oh_s').value.trim().replace(/[,()%*]/g,'');

  const v=document.getElementById('oh_v').value, o=document.getElementById('oh_o').value, p=document.getElementById('oh_p').value;
  const f=document.getElementById('oh_f').value, t=document.getElementById('oh_t').value;
  if(v) q=q.eq('code',v);
  if(o) q=q.eq('oil_type',o);
  if(p) q=q.eq('purpose',p);
  if(f) q=q.gte('entry_datetime',new Date(f+'T00:00:00').toISOString());
  if(t) q=q.lte('entry_datetime',new Date(t+'T23:59:59.999').toISOString());
  const { data, count, error } = await q.range(oePage*OE_PAGE, oePage*OE_PAGE+OE_PAGE-1);

function oeSelectByCode(raw){
  const code=String(raw||'').trim().toUpperCase();
  const v=oeVehicles.find(x=>x.code===code);
  if(!v){ toast(`No registered vehicle for "${code}"`,'error'); return false; }
  oeSel=v; const q=document.getElementById('oe_vq'); if(q) q.value='';
  oeResetRes(); oeShowSel(); toast('Vehicle selected: '+v.vehicle_name,'success');
  return true;
}
async function oeStopScan(){
  const sc=oeScanner; oeScanner=null; if(!sc) return;
  try{ if(sc.isScanning) await sc.stop(); }catch(e){}
  try{ sc.clear(); }catch(e){}
}
function oeOpenScanner(){
  if(typeof Html5Qrcode==='undefined'){ toast('QR scanner could not load. Check your internet connection.','error'); return; }
  openModal('Scan vehicle QR code', `
    <div id="oe_reader" class="w-full rounded-xl overflow-hidden bg-slate-900 min-h-[260px]"></div>
    <p id="oe_scanMsg" class="text-sm text-slate-500 mt-3 text-center">Point the camera at the vehicle's QR code.</p>
    <div class="text-center mt-3"><label class="inline-flex items-center gap-2 text-sm text-teal-700 cursor-pointer hover:underline">
      <i data-lucide="image" class="w-4 h-4"></i> Upload a QR image instead<input type="file" id="oe_qrfile" accept="image/*" class="hidden"/></label></div>`,
    `<button onclick="closeModal()" class="px-3 py-1.5 text-sm border border-slate-300 rounded-lg">Cancel</button>`);
  const msg=t=>{ const m=document.getElementById('oe_scanMsg'); if(m) m.textContent=t; };
  const sc=new Html5Qrcode('oe_reader'); oeScanner=sc; oeScanBusy=false;
  const onHit=async text=>{
    if(oeScanBusy) return; oeScanBusy=true;
    if(oeSelectByCode(text)){ await oeStopScan(); closeModal(); }
    else setTimeout(()=>{ oeScanBusy=false; },1500);
  };
  sc.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:230}},onHit,()=>{})
    .catch(err=>{ const txt=String(err||'');
      msg(/Permission|NotAllowed/i.test(txt)?'Camera access was blocked. Allow the camera in your browser, or upload a QR image.'
        :window.isSecureContext?'Could not start the camera. You can upload a QR image instead.':'The camera needs a secure (https) page. You can upload a QR image instead.'); });
  document.getElementById('oe_qrfile').addEventListener('change', async e=>{
    const file=e.target.files[0]; if(!file) return;
    try{ if(sc.isScanning) await sc.stop(); const text=await sc.scanFile(file,false);
      if(oeSelectByCode(text)){ await oeStopScan(); closeModal(); }
    }catch(err){ msg('No QR code found in that image. Try another one.'); }
    e.target.value='';
  });
  lucide.createIcons();
}

   </div>`;
  const now=new Date(), set=(f,t)=>{ document.getElementById('dc_f').value=f; document.getElementById('dc_t').value=t; dcLoad(); };
