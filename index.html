/* ============================================================
   UNIVERSAL REPLACEMENT HISTORY  (table: item_replacement_history)
   Filter / Oil / Other entry pages all write here; snapshots
   last_filter_consumption / last_oil_consumption are kept in sync by DB triggers.
   ============================================================ */
const RH_TABLE = 'item_replacement_history';
const rhUuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);}));
const rhClean = s => String(s||'').trim().replace(/[,()%*]/g,'');
async function rhLoadItems(cat){
  const { data, error } = await db.from('items').select('id,item_name,item_code,item_category,unit,status').ilike('item_category', cat).order('item_name');
  if (error) throw error;
  return (data||[]).filter(i=>i.status!=='Inactive');
}
/* rows share one entry_group_id; a retry with the same group id cannot duplicate (unique index) */
async function rhInsert(rows){
  const { error } = await db.from(RH_TABLE).insert(rows);
  if (error && error.code!=='23505') return error;   // 23505 = this group was already saved
  return null;
}
const rhBase = (v,it,date,qty,meter,rem,extra) => ({
  vehicle_name:v.vehicle_name, vehicle_code:v.code, item_id:it.id, item_name:it.item_name, item_code:it.item_code,
  item_category:it.item_category, replacement_date:date, quantity:qty, uom:it.unit||null,
  meter_reading:meter, remarks:rem||null, extra_data:extra||{}, created_by:(currentUser&&String(currentUser.id))||null });

/* ---------------- Filter entry (existing UI, dynamic items) ---------------- */
let deItems = [], deGid = null, deBusy = false;
async function deLoadItems(){ try{ deItems = await rhLoadItems('Filter'); }catch(e){ deItems=[]; toast('Could not load filter items: '+e.message,'error'); } deGid = rhUuid(); }
function deBuildFilters(){
  const host = document.getElementById('de_filters'); if(!host) return;
  if (!deItems.length){ host.innerHTML='<div class="text-sm text-slate-500 col-span-full">No active items with category "Filter" found in Item Master.</div>'; return; }
  host.innerHTML = deItems.map(it=>`
   <div class="border border-slate-200 rounded-xl p-3"><label class="block mb-2 text-sm font-medium">${escapeHtml(it.item_name)} <span class="font-mono text-[10px] text-slate-400">${escapeHtml(it.item_code||'')}</span></label>
     <div class="grid grid-cols-3 gap-1.5 bg-slate-100 p-1 rounded-xl">
       ${[0,1,2].map(n=>`<label class="cursor-pointer"><input type="radio" name="de_${it.id}" value="${n}" class="peer sr-only" ${n===0?'checked':''}/>
         <span class="block text-center py-2.5 rounded-lg font-bold text-lg text-slate-500 peer-checked:bg-teal-50 peer-checked:text-teal-700 peer-checked:ring-2 peer-checked:ring-teal-600">${n}</span></label>`).join('')}
     </div></div>`).join('');
}
async function deSave(){
  if (deBusy) return;
  const er = document.getElementById('de_err'); er.textContent='';
  const date = document.getElementById('de_date').value, mr = document.getElementById('de_meter').value.trim(), n = parseFloat(mr);
  if (!date){ er.textContent='Select the filter change date.'; return; }
  if (!deSel || !fqVehicles.some(v=>v.id===deSel.id)){ er.textContent='Select a vehicle from the list.'; return; }
  if (mr==='' || isNaN(n) || n<0){ er.textContent='Enter a valid meter reading (0 or more). Use 0 if the vehicle has no meter.'; return; }
  const gid = deGid || (deGid = rhUuid());
  const rows = [];
  for (const it of deItems){
    const c = document.querySelector(`input[name="de_${it.id}"]:checked`), q = c ? parseInt(c.value,10) : 0;
    if (q>0) rows.push({...rhBase(deSel,it,date,q,n,null,{source:'filter_entry'}), entry_group_id:gid});
  }
  if (!rows.length){ er.textContent='Select quantity 1 or 2 for at least one filter.'; return; }
  deBusy = true; const b = document.getElementById('de_save'); b.disabled = true; b.textContent = 'Saving…';
  const error = await rhInsert(rows);
  deBusy = false; b.disabled = false; b.innerHTML = '&#10003; Save Record';
  if (error){ er.textContent='Not saved: '+error.message; toast('Record not saved','error'); return; }
  try{ await logActivity('FILTER_RECORD_CREATE',RH_TABLE,null,`${deSel.vehicle_name} (${deSel.code})`); }catch(e){}
  toast('Record saved for '+deSel.vehicle_name,'success');
  deSel = null; deGid = rhUuid(); deShowSel(); deResetRes(); deBuildFilters();
  document.getElementById('de_meter').value='0'; document.getElementById('de_date').value=deToday();
}
{ const _r = ROUTES.de_record; ROUTES.de_record = async host => { await deLoadItems(); return _r(host); }; }

let oeGid = null;
async function oeLoadOilItems(){
  let items=[]; try{ items = await rhLoadItems('Oil'); }catch(e){ toast('Could not load oil items: '+e.message,'error'); }
  OE_OILS.length = 0; items.forEach(i=>OE_OILS.push([i.item_name, i.unit||'Litre', i.id, i.item_code, i.item_category]));
  oeGid = rhUuid();
}
function oeBuildOils(){
  const host = document.getElementById('oe_oils'); if(!host) return;
  if(!OE_OILS.length){ host.innerHTML='<div class="text-sm text-slate-500 col-span-full">No active items with category "Oil" found in Item Master.</div>'; return; }
  host.innerHTML=OE_OILS.map((o,i)=>`
   <div class="border border-slate-200 rounded-xl p-3"><div class="text-sm font-medium mb-2 break-words">${escapeHtml(o[0])} <span class="text-slate-400 text-xs">(${escapeHtml(o[1])})</span></div>
     <div class="flex gap-1 bg-slate-100 p-1 rounded-xl">
       ${[0,6,10].map(n=>`<button type="button" data-i="${i}" data-n="${n}" class="${oeSegCls(n===0)}">${n}</button>`).join('')}
       <button type="button" data-i="${i}" data-n="other" class="${oeSegCls(false)}">Other</button></div>
     <input type="number" id="oe_o${i}" inputmode="decimal" min="0" step="0.01" placeholder="Qty" class="hidden mt-2 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm"/></div>`).join('');
}
async function oeSave(){
  if(oeBusy) return;
  const er=document.getElementById('oe_err'); er.textContent='';
  const fail=m=>{ er.textContent=m; };
  const mr=document.getElementById('oe_meter').value.trim(), m=parseFloat(mr);
  if(!oeSel || !oeVehicles.some(v=>v.code===oeSel.code)) return fail('Select a vehicle from the list.');
  for(let i=0;i<OE_OILS.length;i++){
    const oth=document.getElementById('oe_o'+i);
    if(!oth.classList.contains('hidden') && !(oeQty[i]>0)) return fail('Enter a quantity greater than zero for: '+OE_OILS[i][0]+' (or select 0).');
  }
  const used=OE_OILS.map((o,i)=>({o,q:oeQty[i]})).filter(x=>x.q>0);
  if(!used.length) return fail('Enter a quantity for at least one oil type.');
  if(!oePurpose) return fail('Select a purpose.');
  if(mr===''||isNaN(m)||m<0) return fail('Enter a valid meter reading (0 or more).');
  oeBusy=true;
  const b=document.getElementById('oe_save'); b.disabled=true; b.textContent='Saving…';
  const gid = oeGid || (oeGid = rhUuid()), now=new Date().toISOString(), rm=document.getElementById('oe_rem').value.trim()||null;
  const v={vehicle_name:oeSel.vehicle_name, code:oeSel.code};
  const rows=used.map(x=>({...rhBase(v,{id:x.o[2],item_name:x.o[0],item_code:x.o[3],item_category:x.o[4],unit:x.o[1]},deToday(),x.q,m,rm,
      {source:'oil_entry',purpose:oePurpose,operator_name:(currentUser&&currentUser.full_name)||null,company:'Automobile',entry_datetime:now}), entry_group_id:gid}));
  const error = await rhInsert(rows);
  oeBusy=false; b.disabled=false; b.innerHTML='&#10003; Save Oil Entry';
  if(error){ fail('Not saved: '+error.message); toast('Oil entry not saved','error'); return; }
  try{ await logActivity('OIL_ENTRY_CREATE',RH_TABLE,null,`${oeSel.vehicle_name} (${oeSel.code})`); }catch(e){}
  toast('Oil entry saved for '+oeSel.vehicle_name,'success');
  oeSel=null; oePurpose=null; oeQty=OE_OILS.map(()=>0); oeGid=rhUuid();
  oeShowSel(); oeResetRes(); oeBuildOils();
  document.querySelectorAll('#oe_purp button').forEach(x=>x.className='oe-p py-3 px-2 rounded-lg text-sm font-bold border-2 bg-slate-100 text-slate-500 border-transparent');
  document.getElementById('oe_meter').value='0'; document.getElementById('oe_rem').value='';
}

const otCard='bg-white rounded-xl shadow-sm border border-slate-200 p-5', otInp='w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm';

function otShowVeh(){
  document.getElementById('ot_vsel').innerHTML = otVeh ? `<div class="mt-3 flex items-center gap-3 rounded-xl border-2 border-teal-600 bg-teal-50 px-4 py-3"><div><div class="font-semibold">${escapeHtml(otVeh.vehicle_name)}</div><div class="font-mono text-xs text-slate-500">${escapeHtml(otVeh.code)}</div></div><button type="button" id="ot_vclr" class="ml-auto text-sm px-3 py-1.5 rounded-lg bg-white border border-slate-300">Change</button></div>` : '';
  const c=document.getElementById('ot_vclr'); if(c) c.onclick=()=>{ otVeh=null; otShowVeh(); };
}
let otFound=[];
async function otSearchItems(){
  const q=rhClean(document.getElementById('ot_iq').value), box=document.getElementById('ot_ires'); if(!box) return;
  if(q.length<2){ box.classList.add('hidden'); return; }
  const { data, error } = await db.from('items').select('id,item_name,item_code,item_category,unit,status')
    .or(`item_name.ilike.%${q}%,item_code.ilike.%${q}%,item_category.ilike.%${q}%`).order('item_name').limit(40);
  box.classList.remove('hidden');
  if(error){ box.innerHTML=`<div class="p-4 text-sm text-red-600">${escapeHtml(error.message)}</div>`; return; }
  otFound=(data||[]).filter(i=>i.status!=='Inactive' && !/^(filter|oil)$/i.test((i.item_category||'').trim())).slice(0,20);
  box.innerHTML=otFound.length?otFound.map((i,k)=>`<button type="button" data-i="${k}" class="block w-full px-4 py-2.5 text-left border-b border-slate-200 bg-white hover:bg-teal-50"><div class="text-sm font-medium">${escapeHtml(i.item_name)}</div><div class="text-xs text-slate-500"><span class="font-mono">${escapeHtml(i.item_code||'')}</span> · ${escapeHtml(i.item_category||'—')} · ${escapeHtml(i.unit||'')}</div></button>`).join(''):'<div class="p-4 text-sm text-slate-500">No matching items (Filter/Oil items use their own pages)</div>';
}
function otAdd(it){
  if(!it) return;
  if(otRows.some(r=>r.it.id===it.id)){ toast('Item already added.','error'); return; }
  otRows.push({it, qty:1});
  const q=document.getElementById('ot_iq'); q.value=''; document.getElementById('ot_ires').classList.add('hidden'); otRender();
}
function otRender(){
  const h=document.getElementById('ot_list'); if(!h) return;
  h.innerHTML=otRows.length?`<table class="data w-full text-sm"><thead><tr><th class="text-left px-2 py-2">Item</th><th class="text-left px-2 py-2">Code</th><th class="text-left px-2 py-2 w-28">Qty</th><th class="text-left px-2 py-2 w-20">UoM</th><th class="text-left px-2 py-2 w-20">Action</th></tr></thead><tbody>
   ${otRows.map((r,i)=>`<tr><td class="px-2 py-2">${escapeHtml(r.it.item_name)}<div class="text-[11px] text-slate-400">${escapeHtml(r.it.item_category||'')}</div></td><td class="px-2 py-2 font-mono text-xs">${escapeHtml(r.it.item_code||'')}</td>
   <td class="px-2 py-2 align-middle"><input type="number" data-q="${i}" min="0.01" step="any" value="${r.qty}" class="w-24 border border-slate-300 rounded-lg px-2 py-1.5 text-sm"/></td><td class="px-2 py-2 align-middle">${escapeHtml(r.it.unit||'')}</td>
   <td class="px-2 py-2"><button type="button" data-rm="${i}" class="text-red-600 text-xs">Remove</button></td></tr>`).join('')}</tbody></table>`
   :'<div class="text-sm text-slate-400">No items added yet.</div>';
}
async function otSave(){
  if(otBusy) return;
  const er=document.getElementById('ot_err'); er.textContent=''; const fail=m=>{ er.textContent=m; };
  const date=document.getElementById('ot_date').value, mr=document.getElementById('ot_meter').value.trim(), m=mr===''?null:parseFloat(mr);
  if(!otVeh) return fail('Select a vehicle.');
  if(!date) return fail('Select the replacement date.');
  if(!otRows.length) return fail('Add at least one item.');
  if(otRows.some(r=>!(r.qty>0))) return fail('Quantity must be greater than zero for every item.');
  if(m!==null && (isNaN(m)||m<0)) return fail('Enter a valid meter reading.');
  otBusy=true; const b=document.getElementById('ot_save'); b.disabled=true; b.textContent='Saving…';
  const rm=document.getElementById('ot_rem').value.trim();
  const rows=otRows.map(r=>({...rhBase(otVeh,r.it,date,r.qty,m,rm,{source:'other_entry'}), entry_group_id:otGid}));
  const error=await rhInsert(rows);
  otBusy=false; b.disabled=false; b.innerHTML='&#10003; Submit Replacement';
  if(error){ fail('Not saved: '+error.message); toast('Not saved','error'); return; }
  try{ await logActivity('OTHER_REPLACEMENT_CREATE',RH_TABLE,null,`${otVeh.vehicle_name} (${otVeh.code})`); }catch(e){}
  toast('Replacement saved for '+otVeh.vehicle_name,'success');
  otVeh=null; otRows=[]; otGid=rhUuid(); otShowVeh(); otRender();
  document.getElementById('ot_meter').value='0'; document.getElementById('ot_rem').value=''; document.getElementById('ot_date').value=deToday();
}

/* ---------------- History pages (Filter / Oil / Other) ---------------- */
const RH_PAGE = 15; let rhS = {kind:'Filter', page:0, total:0, rows:[]};
function rhQuery(q){
  const k=rhS.kind, g=id=>(document.getElementById(id)||{}).value||'';
  q = q.eq('entry_type', k);
  const s=rhClean(g('rh_s')); if(s) q=q.or(`vehicle_name.ilike.%${s}%,vehicle_code.ilike.%${s}%`);
  const i=rhClean(g('rh_i')); if(i) q=q.or(`item_name.ilike.%${i}%,item_code.ilike.%${i}%`);
  const c=rhClean(g('rh_c')); if(c) q=q.ilike('item_category',`%${c}%`);
  if(k==='Oil' && g('rh_p')) q=q.eq('extra_data->>purpose', g('rh_p'));
  if(g('rh_f')) q=q.gte('replacement_date',g('rh_f'));
  if(g('rh_t')) q=q.lte('replacement_date',g('rh_t'));
  return q;
}
const rhOrder = q => q.order('replacement_date',{ascending:false}).order('created_at',{ascending:false}).order('id',{ascending:false});
function rhRoute(host, kind){
  rhS = {kind, page:0, total:0, rows:[]};
  const inp='w-full border border-slate-300 rounded-lg px-3 py-2 text-sm', L=(t,h)=>`<div><label class="block mb-1 text-xs font-medium">${t}</label>${h}</div>`;
  host.innerHTML=`<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
   <h3 class="font-semibold text-navy-900 mb-3">${kind==='Other'?'Other item replacement':kind+' change'} history</h3>
   <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-6 gap-3 mb-4 items-end">
     ${L('Vehicle',`<input id="rh_s" placeholder="Vehicle name or code" class="${inp}"/>`)}
     ${L('Item',`<input id="rh_i" placeholder="Item name or code" class="${inp}"/>`)}
     ${kind==='Other'?L('Category',`<input id="rh_c" placeholder="Category" class="${inp}"/>`):''}
     ${kind==='Oil'?L('Purpose',`<select id="rh_p" class="${inp}"><option value="">All purposes</option>${OE_PURPOSES.map(p=>`<option>${escapeHtml(p)}</option>`).join('')}</select>`):''}
     ${L('From',`<input type="date" id="rh_f" class="${inp}"/>`)}${L('To',`<input type="date" id="rh_t" class="${inp}"/>`)}
   </div>
   <div class="flex justify-end gap-2 mb-3"><button id="rh_x" class="border border-slate-300 hover:bg-slate-50 rounded-lg px-3 py-2 text-sm font-medium">Export Excel</button><button id="rh_r" class="border border-slate-300 hover:bg-slate-50 rounded-lg px-3 py-2 text-sm font-medium">Refresh</button></div>
   <div id="rh_out" class="text-slate-400 text-sm">Loading…</div>
   <div class="flex items-center justify-between mt-3 gap-2"><button id="rh_pv" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm disabled:opacity-50">Previous</button><span id="rh_pi" class="text-sm text-slate-500"></span><button id="rh_n" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm disabled:opacity-50">Next</button></div></div>`;
  ['rh_s','rh_i','rh_c','rh_p','rh_f','rh_t'].forEach(id=>{ const e=document.getElementById(id); if(e) e.addEventListener('input',()=>{ rhS.page=0; clearTimeout(window._rhT); window._rhT=setTimeout(rhLoad,250); }); });
  document.getElementById('rh_r').onclick=rhLoad; document.getElementById('rh_x').onclick=rhExport;
  document.getElementById('rh_pv').onclick=()=>{ rhS.page--; rhLoad(); }; document.getElementById('rh_n').onclick=()=>{ rhS.page++; rhLoad(); };
  document.getElementById('rh_out').addEventListener('click',e=>{ const b=e.target.closest('button[data-act]'); if(b){ e.stopPropagation(); const r=rhS.rows[b.dataset.i]; return b.dataset.act==='edit'?rhEdit(r):rhDelete(r); } const tr=e.target.closest('[data-i]'); if(tr) rhDetail(rhS.rows[tr.dataset.i]); });
  return rhLoad();
}
const rhCols = k => [['Date','replacement_date'],['Vehicle','vehicle_name'],[k==='Oil'?'Oil Item':'Item','item_name'],...(k==='Other'?[['Category','item_category']]:[]),['Item Code','item_code'],['Quantity','quantity'],['UoM','uom'],['Meter Reading','meter_reading'],['Remarks','remarks']];
async function rhLoad(){
  const out=document.getElementById('rh_out'); if(!out) return;
  const { data, count, error } = await rhOrder(rhQuery(db.from(RH_TABLE).select('*',{count:'exact'}))).range(rhS.page*RH_PAGE, rhS.page*RH_PAGE+RH_PAGE-1);
  if(error){ out.innerHTML=`<div class="text-red-600">Could not load records: ${escapeHtml(error.message)}</div>`; return; }
  rhS.total=count||0; rhS.rows=data; const cols=rhCols(rhS.kind);
  out.innerHTML=data.length?`<div class="overflow-x-auto"><table class="data w-full text-sm"><thead><tr>${cols.map(c=>`<th class="text-left px-3 py-2 whitespace-nowrap">${c[0]}</th>`).join('')}<th class="text-left px-3 py-2">Actions</th></tr></thead><tbody>

/* validate everything locally; returns {good, errors:[{line,msg,row}], dups} */
async function biValidate(k, text){
  const allowDup = !!(document.getElementById('bi_allow')||{}).checked;
  const rows = fqParseCsv(text.replace(/^\uFEFF/,'')).filter(r=>r.some(c=>String(c).trim()!==''));
  const hdr = biHeader(k);
  if (!rows.length) return {fatal:'The file is empty.'};
  const h = rows[0].map(x=>String(x).trim().toLowerCase());
  if (h.length!==hdr.length || hdr.some((c,i)=>h[i]!==c)) return {fatal:'Header must be exactly (same order): '+hdr.join(',')+'  — found: '+rows[0].join(',')};
  if (rows.length<2) return {fatal:'The file has a header but no data rows.'};
  if (rows.length>5001) return {fatal:'Too many rows (max 5000 per file).'};
  if (!fqVehicles || !fqVehicles.length) await fqLoadVehicles();
  const items = await biItems(k), today = deToday();
  const vByCode = new Map(fqVehicles.map(v=>[v.code.toLowerCase(),v]));
  const iByName = new Map(); items.forEach(i=>{ const key=i.item_name.trim().toLowerCase(); iByName.set(key, iByName.has(key)?null:i); });
  const good=[], errors=[], seen=new Set();
  rows.slice(1).forEach((r,n)=>{
    const ln=n+2, c=i=>String(r[i]??'').trim(), bad=m=>errors.push({line:ln,msg:m,row:r});
    if (r.length>hdr.length && r.slice(hdr.length).some(x=>String(x).trim())) return bad('Too many columns (extra commas? wrap text containing commas in quotes)');
    const vName=c(0), vCode=c(1), iName=c(2), qtyS=c(3), mrS=c(4), date=c(5), rem=c(6), purpose=k==='Oil'?c(7):'';
    if(!vCode) return bad('vehicle_code is empty');
    const v=vByCode.get(vCode.toLowerCase()); if(!v) return bad(`vehicle_code "${vCode}" not found in Vehicle Master`);
    if(!vName) return bad('vehicle_name is empty');
    if(v.vehicle_name.trim().toLowerCase()!==vName.toLowerCase()) return bad(`vehicle_name "${vName}" does not match Vehicle Master ("${v.vehicle_name}") for code ${v.code}`);
    if(!iName) return bad(BI[k].nameCol+' is empty');
    if(!iByName.has(iName.toLowerCase())) return bad(`${BI[k].label} "${iName}" not found among active ${k==='Other'?'Other':k} items in Item Master`);
    const it=iByName.get(iName.toLowerCase()); if(!it) return bad(`${BI[k].label} "${iName}" matches more than one Item Master record`);
    const q=Number(qtyS); if(qtyS===''||!isFinite(q)||q<0) return bad(`quantity "${qtyS}" must be a number (0 or more)`);
    let m=0; if(mrS!==''){ m=Number(mrS); if(!isFinite(m)||m<0) return bad(`meter_reading "${mrS}" must be a number 0 or more`); }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || isNaN(Date.parse(date)) || new Date(date+'T00:00:00Z').toISOString().slice(0,10)!==date) return bad(`replacement_date "${date}" must be a valid date as YYYY-MM-DD`);
    if(date>today) return bad(`replacement_date ${date} is in the future`);
    if(rem.length>500) return bad('remarks longer than 500 characters');
    if(k==='Oil' && purpose && !OE_PURPOSES.includes(purpose)) return bad(`purpose "${purpose}" must be one of: ${OE_PURPOSES.join(', ')}`);
    const key=[v.code,it.id,date,m,q].join('|');
    if(!allowDup && seen.has(key)) return errors.push({line:ln,msg:'Duplicate of an earlier row in this file',row:r,dup:true});
    seen.add(key); good.push({ln,v,it,date,q,m,rem,purpose,key,row:r});
  });
  /* duplicates already in the database (one query set per ~50 vehicles, date-bounded) */
  if (good.length && !allowDup){
    const dates=good.map(g=>g.date).sort(), lo=dates[0], hi=dates[dates.length-1], codes=[...new Set(good.map(g=>g.v.code))], exist=new Set();
    for(let i=0;i<codes.length;i+=50) for(let from=0;;from+=1000){
      const {data,error}=await db.from(RH_TABLE).select('vehicle_code,item_id,replacement_date,meter_reading,quantity').eq('entry_type',k).in('vehicle_code',codes.slice(i,i+50)).gte('replacement_date',lo).lte('replacement_date',hi).range(from,from+999);
      if(error) return {fatal:'Could not check existing records: '+error.message};
      (data||[]).forEach(r=>exist.add([r.vehicle_code,r.item_id,r.replacement_date,r.meter_reading===null?null:Number(r.meter_reading),Number(r.quantity)].join('|')));
      if(!data||data.length<1000) break; }
    for(let i=good.length-1;i>=0;i--) if(exist.has(good[i].key)){ const g=good.splice(i,1)[0]; errors.push({line:g.ln,msg:'Duplicate: identical record already exists in the system',row:g.row,dup:true}); }
  }
  errors.sort((a,b)=>a.line-b.line);
  return {good, errors, total:rows.length-1};
}
function biErrFile(k,errs){ return biCsv([['error_line','error_reason'].concat(biHeader(k))].concat(errs.map(e=>[e.line,e.msg].concat(e.row)))); }
async function biRun(){
  const k=biState.kind; if(biState.busy) return;
  if(!biState.file){ toast('Choose a CSV file first','error'); return; }
  const btn=document.getElementById('bi_imp'); biState.busy=true; btn.disabled=true; btn.textContent='Validating…';
  try{
    const res=await biValidate(k, await biState.file.text());
    if(res.fatal){ biReport(false,res.fatal); return; }
    const hard=res.errors.filter(e=>!e.dup), dups=res.errors.filter(e=>e.dup);
    const lines=res.errors.map(e=>`Row ${e.line}: ${e.msg}`);
    if(!res.good.length){ biReport(false,`Nothing to import — ${hard.length} invalid, ${dups.length} duplicate of ${res.total} rows.`,lines); return; }
    if(hard.length){ /* never silently skip: user must confirm importing only the valid rows */
      biReport(false,`${hard.length} invalid row(s) found. ${res.good.length} valid row(s) are ready.`,lines,
        `<div class="mt-2 flex gap-2"><button id="bi_go" class="bg-teal-600 text-white rounded-lg px-3 py-1.5 text-xs font-medium">Import ${res.good.length} valid row(s) only</button><button id="bi_err" class="border border-red-300 rounded-lg px-3 py-1.5 text-xs font-medium">Download error file</button></div>`);
      document.getElementById('bi_go').onclick=()=>biCommit(k,res,true);
      document.getElementById('bi_err').onclick=()=>biDownload(`${k.toLowerCase()}_import_errors.csv`,biErrFile(k,res.errors));
    } else await biCommit(k,res,false);
  }catch(e){ biReport(false,'Import failed: '+(e.message||e)); }
  finally{ biState.busy=false; btn.disabled=false; btn.innerHTML='<i data-lucide="upload-cloud" class="w-4 h-4"></i>Import CSV'; lucide.createIcons(); }
}
async function biCommit(k,res,partial){
  if(biState.busy && partial===false && false) return;
  const btn=document.getElementById('bi_imp'); biState.busy=true; btn.disabled=true;
  const go=document.getElementById('bi_go'); if(go) go.disabled=true;
  const groups=new Map(), failed=[]; let ok=0;
  res.good.forEach(g=>{ const gk=[g.v.code,g.date,g.m].join('|'); if(!groups.has(gk)) groups.set(gk,[]); const bk=groups.get(gk); let b=bk.find(x=>!x.items.has(g.it.id)); if(!b){ b={gid:rhUuid(),items:new Set()}; bk.push(b); } b.items.add(g.it.id); g.gid=b.gid; });
  const mk=g=>({...rhBase(g.v,g.it,g.date,g.q,g.m,g.rem,Object.assign({source:BI[k].src},g.purpose?{purpose:g.purpose}:{})),entry_group_id:g.gid});
  const CH=200;
  for(let i=0;i<res.good.length;i+=CH){
    const part=res.good.slice(i,i+CH); btn.textContent=`Importing ${Math.min(i+CH,res.good.length)} / ${res.good.length}…`;
    const err=await rhInsert(part.map(mk));    // single batched request per chunk
    if(err) part.forEach(g=>failed.push({line:g.ln,msg:'Database error: '+err.message,row:g.row})); else ok+=part.length;
  }
  try{ await logActivity(k.toUpperCase()+'_CSV_IMPORT',RH_TABLE,null,`${ok} records imported`); }catch(e){}
  const all=res.errors.concat(failed), dups=res.errors.filter(e=>e.dup).length, bad=all.length-dups;
  biReport(failed.length===0&&bad===0, `Import finished — Total in CSV: ${res.total} · Imported: ${ok} · Failed: ${bad} · Duplicates skipped: ${dups}`,
    all.sort((a,b)=>a.line-b.line).map(e=>`Row ${e.line}: ${e.msg}`),
    all.length?`<div class="mt-2"><button id="bi_err" class="border border-slate-300 bg-white rounded-lg px-3 py-1.5 text-xs font-medium text-slate-700">Download rows to fix &amp; re-import</button></div>`:'');
  const eb=document.getElementById('bi_err'); if(eb) eb.onclick=()=>biDownload(`${k.toLowerCase()}_import_errors.csv`,biErrFile(k,all));
  toast(`${ok} record(s) imported`,ok?'success':'error');
  biState.busy=false; btn.disabled=false; btn.innerHTML='<i data-lucide="upload-cloud" class="w-4 h-4"></i>Import CSV'; lucide.createIcons();
  if(ok && typeof rhLoad==='function'){ rhS.page=0; rhLoad(); }
}

async function miInChunks(table, col, ids, sel='*'){

/* ---- Diesel activity (reuses oilDb.diesel_data: code, vehicle_name, entry_datetime, quantity) ---- */
async function miDieselSetting(){
  const { data } = await db.from('maintenance_app_settings').select('value').eq('key','diesel_eligibility').maybeSingle();
  const v = (data && data.value) || {}; return { enabled: v.enabled!==false, days: Number(v.days)>0 ? Number(v.days) : 14 };
}
async function miLastDiesel(codes){           // latest ACTUAL consumption date (entry_datetime) per vehicle code
  const want = new Set(codes.map(c=>String(c).toUpperCase())), map = new Map(); let from=0;
  for (let page=0; page<40; page++){
    const { data, error } = await oilDb.from('diesel_data').select('code,entry_datetime').order('entry_datetime',{ascending:false}).range(from,from+999);
    if (error) throw error;
    (data||[]).forEach(r=>{ const c=String(r.code||'').toUpperCase(); if(want.has(c) && !map.has(c)) map.set(c, r.entry_datetime); });
    if (!data || data.length<1000 || map.size>=want.size) break; from+=1000;
  }
  return map;
}
async function miEligibility(vehicles){
  const st = await miDieselSetting(), today = new Date(); today.setHours(0,0,0,0);
  const last = st.enabled ? await miLastDiesel(vehicles.map(v=>v.code)) : new Map();
  const rows = vehicles.map(v=>{
    const d = last.get(String(v.code).toUpperCase()); let days = null;
    if (d){ const dd=new Date(d); dd.setHours(0,0,0,0); days = Math.round((today-dd)/864e5); }
    return { v, last:d||null, days, eligible: !st.enabled || (days!==null && days<=st.days) };
  });
  return { st, rows, eligible:new Set(rows.filter(r=>r.eligible).map(r=>r.v.code)) };
}

async function miHashUuid(s){ const b=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s))); const h=Array.from(b).slice(0,16).map(x=>x.toString(16).padStart(2,'0')).join(''); return `${h.slice(0,8)}-${h.slice(8,12)}-4${h.slice(13,16)}-8${h.slice(17,20)}-${h.slice(20,32)}`; }
async function miMig(b){
  b.innerHTML=`<div class="${miCard} space-y-3"><h3 class="font-semibold text-navy-900">Migrate old Oil entries</h3><p class="text-sm text-slate-500">Copies legacy <b>oil_entries</b> (oil project) into <b>item_replacement_history</b>. Oil type names must exactly match an Oil-category item name; anything unmatched is listed for manual review and NOT assigned. Safe to re-run (no duplicates). The old table is not changed. Filter history is migrated with SQL file 03.</p>

      let all=[], from=0; for(;;){ const { data, error } = await oilDb.from('oil_entries').select('*').order('entry_datetime',{ascending:true}).range(from,from+999); if(error) throw error; all=all.concat(data||[]); if(!data||data.length<1000) break; from+=1000; }
      const items=await rhLoadItems('Oil'), im=new Map(items.map(i=>[i.item_name.trim().toLowerCase(),i]));
      const rows=[], unm=new Map(); let zero=0;
      for(const r of all){ const it=im.get(String(r.oil_type||'').trim().toLowerCase()), q=Number(r.quantity);
        if(!(q>0)){ zero++; continue; } if(!it){ unm.set(r.oil_type,(unm.get(r.oil_type)||0)+1); continue; }
        rows.push({ entry_group_id: await miHashUuid('oil|'+r.code+'|'+r.entry_datetime), vehicle_name:r.vehicle_name, vehicle_code:r.code, item_id:it.id, item_name:it.item_name, item_code:it.item_code, item_category:it.item_category,
          replacement_date:miYmd(new Date(r.entry_datetime)), quantity:q, uom:it.unit||r.unit||null, meter_reading:r.meter_reading, remarks:r.remarks||null, created_at:r.entry_datetime,
          extra_data:{source:'oil_migration',purpose:r.purpose||null,operator_name:r.operator_name||null,company:r.company||null,legacy_id:r.id??null} }); }
      out.textContent=`Writing ${rows.length} rows…`;
      for(let i=0;i<rows.length;i+=200){ const { error } = await db.from(RH_TABLE).upsert(rows.slice(i,i+200),{onConflict:'entry_group_id,item_id',ignoreDuplicates:true}); if(error) throw error; }
      const { count } = await db.from(RH_TABLE).select('id',{count:'exact',head:true}).eq('extra_data->>source','oil_migration');
      out.innerHTML=`<div class="rounded-lg bg-green-50 text-green-700 p-3">Old rows read: <b>${all.length}</b> · valid & matched: <b>${rows.length}</b> · skipped zero qty: <b>${zero}</b> · unmatched: <b>${[...unm.values()].reduce((a,b)=>a+b,0)}</b> · migrated rows now in new table: <b>${count}</b></div>`+
        (unm.size?`<div class="mt-3 font-semibold">Unmatched oil types (review manually, add/rename in Item Master then re-run):</div><ul class="list-disc ml-5">${[...unm].map(([k,v])=>`<li>${escapeHtml(k)} — ${v} rows</li>`).join('')}</ul>`:'');
    }catch(err){ out.innerHTML=`<div class="text-red-600">${escapeHtml(err.message)}</div>`; }
    btn.disabled=false; };
}

async function calCompute(){
  const [stdR, ovR, lf, lo] = await Promise.all([
    db.from('maintenance_interval_settings').select('*'), db.from('vehicle_interval_overrides').select('*'),
    db.from('last_filter_consumption').select('*'), db.from('last_oil_consumption').select('*'), fqLoadVehicles()]);
  [stdR,ovR,lf,lo].forEach(r=>{ if(r.error) throw r.error; });
  const std=new Map(stdR.data.map(s=>[s.item_id,s])), ov=new Map(ovR.data.map(o=>[o.vehicle_code+'|'+o.item_id,o]));
  const el=await miEligibility(fqVehicles); calExcl=el.rows.filter(r=>!r.eligible); const vm=new Map(fqVehicles.map(v=>[v.code,v]));
  const eff=(vc,iid)=>{ const o=ov.get(vc+'|'+iid), s=std.get(iid);
    if(o) return o.interval_type==='No Interval'?null:{type:o.interval_type,val:+o.interval_value,qty:+(o.required_qty||s?.required_qty||1)};
    if(s && s.enabled && s.interval_type!=='No Interval') return {type:s.interval_type,val:+s.interval_value,qty:+s.required_qty||1}; return null; };
  /* baseline records: Filter/Oil from the snapshot tables; Other from item_replacement_history (only for configured items) */
  const base=[]; lf.data.forEach(r=>base.push({...r,cat:'Filter'})); lo.data.forEach(r=>base.push({...r,cat:r.item_category||'Oil'}));
  const otherIds=[...new Set([...stdR.data.filter(s=>s.enabled).map(s=>s.item_id),...ovR.data.filter(o=>o.interval_type!=='No Interval').map(o=>o.item_id)])];
  const known=new Set(base.map(b=>b.item_id)); const itemRows=otherIds.length?await miInChunks('items','id',otherIds,'id,item_name,item_code,item_category,unit'):[]; const im=new Map(itemRows.map(i=>[i.id,i]));
  const otherItems=otherIds.filter(id=>{ const c=(im.get(id)?.item_category||'').trim().toLowerCase(); return c!=='filter'&&c!=='oil'; });
  if(otherItems.length){
    const seen=new Set(); for(let i=0;i<otherItems.length;i+=60){ let from=0; for(;;){
      const { data, error } = await db.from(RH_TABLE).select('vehicle_code,vehicle_name,item_id,item_name,item_code,item_category,replacement_date,quantity,uom,meter_reading,id,created_at').eq('entry_type','Other').in('item_id',otherItems.slice(i,i+60)).order('replacement_date',{ascending:false}).order('created_at',{ascending:false}).range(from,from+999);
      if(error) throw error; (data||[]).forEach(r=>{ const k=r.vehicle_code+'|'+r.item_id; if(!seen.has(k)){ seen.add(k); base.push({vehicle_code:r.vehicle_code,vehicle_name:r.vehicle_name,item_id:r.item_id,item_name:r.item_name,item_code:r.item_code,item_category:r.item_category,last_replacement_date:r.replacement_date,last_meter_reading:r.meter_reading,cat:r.item_category||'Other'}); } });
      if(!data||data.length<1000) break; from+=1000; } }
  }
  /* latest known meter per vehicle (highest reading recorded in latest-replacement data) */
  const cur=new Map(); base.forEach(b=>{ const m=+b.last_meter_reading; if(m>0 && (!cur.has(b.vehicle_code)||m>cur.get(b.vehicle_code))) cur.set(b.vehicle_code,m); });
  const litre=base.filter(b=>el.eligible.has(b.vehicle_code) && eff(b.vehicle_code,b.item_id)?.type==='Diesel Litres');
  let dz=[]; if(litre.length){ const min=litre.reduce((a,b)=>b.last_replacement_date<a?b.last_replacement_date:a,'9999'); const codes=new Set(litre.map(b=>String(b.vehicle_code).toUpperCase())); let from=0;
    for(;;){ const { data, error } = await oilDb.from('diesel_data').select('code,entry_datetime,quantity').gte('entry_datetime',new Date(min+'T00:00:00').toISOString()).order('entry_datetime',{ascending:true}).range(from,from+999); if(error) throw error;
      (data||[]).forEach(r=>{ if(codes.has(String(r.code).toUpperCase())) dz.push(r); }); if(!data||data.length<1000) break; from+=1000; } }
  const today=miYmd(new Date()), out=[];
  for(const b of base){
    if(!el.eligible.has(b.vehicle_code)) continue; const e=eff(b.vehicle_code,b.item_id); if(!e) continue;
    const last=String(b.last_replacement_date).slice(0,10); let key=null, note='';
    if(e.type==='Days'){ const d=miParse(last); d.setDate(d.getDate()+e.val); key=miYmd(d); note=`Last ${miFmt(last)} + ${e.val} days`; }
    else if(e.type==='Hours'||e.type==='Kilometers'){ const lm=+b.last_meter_reading, c=cur.get(b.vehicle_code); if(!(lm>=0)||!c) continue; const nd=lm+e.val;
      if(c>=nd){ key=today; note=`Next due ${nd} ${MI_UNIT[e.type]} · current ${c}`+(c>nd?` (${c-nd} over)`:''); } else continue; }
    else if(e.type==='Diesel Litres'){ const lt=dz.filter(r=>String(r.code).toUpperCase()===String(b.vehicle_code).toUpperCase() && r.entry_datetime>=new Date(last+'T00:00:00').toISOString()).reduce((a,r)=>a+(+r.quantity||0),0);
      if(lt>=e.val){ key=today; note=`${Math.round(lt)} L used since ${miFmt(last)} (interval ${e.val} L)`; } else continue; }
    if(!key) continue; const v=vm.get(b.vehicle_code);
    out.push({key, vcode:b.vehicle_code, vname:(v&&v.vehicle_name)||b.vehicle_name, item_id:b.item_id, iname:b.item_name, icode:b.item_code, cat:b.cat, qty:e.qty, uom:b.uom||im.get(b.item_id)?.unit||'', note, meter:cur.get(b.vehicle_code)||'', gid:rhUuid(), item:{id:b.item_id,item_name:b.item_name,item_code:b.item_code,item_category:b.item_category||b.cat,unit:b.uom||im.get(b.item_id)?.unit||null}});
  }
  calData=out;
  const { data:pd } = await db.from('maintenance_checklist_status').select('vehicle_code,item_id,reason'); calPend=new Map((pd||[]).map(p=>[p.vehicle_code+'|'+p.item_id,p.reason]));
}

  const side=sel?[...sel].sort((a,b)=>a[1][0].vname.localeCompare(b[1][0].vname,undefined,{numeric:true})).map(([vc,its])=>`<button data-v="${escapeHtml(vc)}" class="relative w-full text-left rounded-xl border-2 ${CARD[st]} shadow-sm pl-5 pr-4 py-4 transition overflow-hidden"><span class="absolute left-0 top-0 bottom-0 w-2 ${BAR[st]}"></span>
    <div class="flex items-start justify-between gap-2"><div><div class="font-bold text-base text-navy-900">${escapeHtml(its[0].vname)}</div><div class="font-mono text-xs text-slate-500">${escapeHtml(vc)}</div></div><span class="shrink-0 text-xs font-bold px-2.5 py-1 rounded-full text-white ${BAR[st]}">${its.length} item${its.length>1?'s':''} due</span></div>
    <div class="flex flex-wrap gap-1.5 mt-3">${its.slice(0,4).map(x=>`<span class="text-[11px] px-2 py-0.5 rounded-full bg-white/80 border border-slate-200 text-slate-700">${escapeHtml(x.iname)}</span>`).join('')}${its.length>4?`<span class="text-[11px] px-2 py-0.5 rounded-full bg-white/80 border border-slate-200 text-slate-500">+${its.length-4} more</span>`:''}</div></button>`).join(''):'<div class="text-sm text-slate-400 py-4 col-span-full">No vehicles due on this date.</div>';
  body.innerHTML=`<div class="grid grid-cols-1 lg:grid-cols-5 gap-4"><div class="${miCard} lg:col-span-2 self-start !p-3"><div class="grid grid-cols-7 gap-1 text-[10px] font-semibold text-slate-400 mb-1 text-center">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div>${x}</div>`).join('')}</div><div class="grid grid-cols-7 gap-1" id="cl_grid">${cells}</div>
    <p class="text-[11px] text-slate-400 mt-3">Hour/km/diesel-based items appear on today (when already due) — no calendar date is estimated without usage data. Items with no previous replacement record are not scheduled.</p></div>
    <div class="${miCard} lg:col-span-3"><div class="flex items-center justify-between mb-4"><div><h3 class="text-lg font-bold text-navy-900">${miFmt(calSel)}</h3><div class="text-sm text-slate-500">${sel?sel.size:0} vehicle${sel&&sel.size!==1?'s':''} due</div></div>${st?`<span class="px-3 py-1 rounded-full text-sm font-semibold ${CAL_CLS[st]}">${CAL_LBL[st]}</span>`:''}</div><div id="cl_side" class="grid grid-cols-1 xl:grid-cols-2 gap-3">${side}</div></div></div>`;
  document.getElementById('cl_grid').onclick=e=>{ const b=e.target.closest('button[data-d]'); if(b){ calSel=b.dataset.d; calRender(); } };
  document.getElementById('cl_side').onclick=e=>{ const b=e.target.closest('button[data-v]'); if(b) calOpenChecklist(b.dataset.v, calSel); };
}
function calShowExcluded(){
  openModal('Excluded vehicles (no recent diesel consumption)', calExcl.length?`<div class="overflow-x-auto max-h-96"><table class="data w-full text-sm"><thead><tr><th class="text-left px-2 py-2">Vehicle</th><th class="text-left px-2 py-2">Last diesel</th></tr></thead><tbody>${calExcl.map(r=>`<tr><td class="px-2 py-2">${escapeHtml(r.v.vehicle_name)} <span class="font-mono text-xs text-slate-400">${escapeHtml(r.v.code)}</span></td><td class="px-2 py-2">${r.last?fmtDateTime(r.last)+' ('+r.days+' d ago)':'No history'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="text-sm text-slate-500">No vehicles excluded.</div>',`<button onclick="closeModal()" class="px-3 py-1.5 text-sm border border-slate-300 rounded-lg">Close</button>`);
}

/* ---------------- Maintenance Checklist (per vehicle) ---------------- */
let ckItems=[];
function calOpenChecklist(vcode, key){
  ckItems=calData.filter(x=>x.vcode===vcode && x.key===key); if(!ckItems.length) return; const v=ckItems[0], today=miYmd(new Date());
  openModal(`Maintenance checklist — ${v.vname}`, `<div class="text-xs text-slate-500 mb-3">${escapeHtml(vcode)} · due ${miFmt(key)} · ${CAL_LBL[calStatus(key)]}</div><div id="ck_list" class="space-y-3">
   ${ckItems.map((x,i)=>{ const pr=calPend.get(x.vcode+'|'+x.item_id); return `<div class="border border-slate-200 rounded-xl p-3" data-i="${i}">
    <div class="flex flex-wrap justify-between gap-2"><div><div class="text-sm font-semibold">${i+1}. ${escapeHtml(x.iname)}</div><div class="text-xs text-slate-500">${escapeHtml(x.cat)} · Required qty ${x.qty} ${escapeHtml(x.uom)}</div><div class="text-[11px] text-slate-400">${escapeHtml(x.note)}</div>${pr!==undefined?`<div class="text-[11px] text-amber-700 mt-1">Pending — ${escapeHtml(pr||'')}</div>`:''}</div>
    <div class="flex gap-1.5 items-start"><label class="cursor-pointer"><input type="radio" name="ck${i}" value="yes" class="peer sr-only"/><span class="block px-3 py-1.5 rounded-lg text-sm font-bold bg-slate-100 text-slate-500 peer-checked:bg-green-100 peer-checked:text-green-700">Yes</span></label><label class="cursor-pointer"><input type="radio" name="ck${i}" value="no" class="peer sr-only"/><span class="block px-3 py-1.5 rounded-lg text-sm font-bold bg-slate-100 text-slate-500 peer-checked:bg-red-100 peer-checked:text-red-700">No</span></label></div></div>
    <div class="ck-yes hidden mt-3 grid grid-cols-2 gap-2"><label class="text-xs">Actual qty<input type="number" data-f="qty" min="0" step="any" value="${x.qty}" class="${miInp} w-full"/></label><label class="text-xs">Meter reading<input type="number" data-f="meter" min="0" step="any" value="${x.meter}" class="${miInp} w-full"/></label><label class="text-xs">Replacement date<input type="date" data-f="date" max="${today}" value="${today}" class="${miInp} w-full"/></label><label class="text-xs">Remarks<input data-f="rem" class="${miInp} w-full"/></label></div>
    <div class="ck-no hidden mt-3"><label class="text-xs">Reason (required)<input data-f="reason" class="${miInp} w-full"/></label></div>
    <div class="ck-act hidden mt-3 text-right"><button data-save class="px-4 py-1.5 text-sm bg-teal-600 hover:bg-teal-700 text-white rounded-lg">Save</button></div></div>`; }).join('')}</div>`,
   `<button onclick="closeModal()" class="px-3 py-1.5 text-sm border border-slate-300 rounded-lg">Close</button>`);
  const L=document.getElementById('ck_list');
  L.addEventListener('change',e=>{ const c=e.target.closest('[data-i]'); if(!c||e.target.type!=='radio') return; const y=e.target.value==='yes'; c.querySelector('.ck-yes').classList.toggle('hidden',!y); c.querySelector('.ck-no').classList.toggle('hidden',y); c.querySelector('.ck-act').classList.remove('hidden'); });
  L.addEventListener('click',e=>{ const b=e.target.closest('button[data-save]'); if(b) ckSave(b.closest('[data-i]'), b); });
}
async function ckSave(card, btn){
  const x=ckItems[+card.dataset.i], ans=(card.querySelector('input[type=radio]:checked')||{}).value, f=k=>(card.querySelector(`[data-f=${k}]`)||{}).value||'';
  if(!ans) return; const v={vehicle_name:x.vname, code:x.vcode};
  if(ans==='no'){ const reason=f('reason').trim(); if(!reason){ toast('Enter the reason.','error'); return; }
    btn.disabled=true; const { error } = await db.from('maintenance_checklist_status').upsert({vehicle_code:x.vcode,vehicle_name:x.vname,item_id:x.item_id,item_name:x.iname,status:'Pending',reason,due_date:x.key,created_by:miUser(),updated_at:new Date().toISOString()},{onConflict:'vehicle_code,item_id'}); btn.disabled=false;
    if(error){ toast('Not saved: '+error.message,'error'); return; } calPend.set(x.vcode+'|'+x.item_id,reason); toast('Marked pending with reason','success'); card.querySelector('.ck-act').classList.add('hidden'); return; }
  const q=parseFloat(f('qty')), m=f('meter')===''?null:parseFloat(f('meter')), d=f('date');
  if(!(q>0)){ toast('Actual quantity must be greater than zero.','error'); return; } if(!d){ toast('Select the replacement date.','error'); return; } if(m!==null&&(isNaN(m)||m<0)){ toast('Invalid meter reading.','error'); return; }
  btn.disabled=true;      /* x.gid is fixed for this checklist line => double-click / retry cannot duplicate */
  const err=await rhInsert([{...rhBase(v,x.item,d,q,m,f('rem').trim()||null,{source:'checklist',scheduled_due:x.key}), entry_group_id:x.gid}]);
  if(err){ btn.disabled=false; toast('Not saved: '+err.message,'error'); return; }
  await db.from('maintenance_checklist_status').delete().eq('vehicle_code',x.vcode).eq('item_id',x.item_id); calPend.delete(x.vcode+'|'+x.item_id);
  try{ await logActivity('CHECKLIST_REPLACEMENT',RH_TABLE,null,`${x.vname} / ${x.iname}`); }catch(e){}
  calData=calData.filter(z=>!(z.vcode===x.vcode&&z.item_id===x.item_id)); toast('Replacement recorded','success');
  card.innerHTML=`<div class="text-sm text-green-700 font-medium">&#10003; ${escapeHtml(x.iname)} — completed</div>`; calRender();
}

</script>
</body>
</html>
